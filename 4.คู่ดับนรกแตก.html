<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หวย V5: iPad Optimized Copy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Sarabun', sans-serif; }
        .animate-pop { animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes pop { 
            0% { transform: scale(0.95); opacity: 0; } 
            100% { transform: scale(1); opacity: 1; } 
        }
        #toast {
            visibility: hidden; min-width: 280px; background-color: #3b82f6; color: #fff;
            text-align: center; border-radius: 50px; padding: 14px 28px; position: fixed;
            z-index: 99; left: 50%; bottom: 40px; transform: translateX(-50%) translateY(20px);
            opacity: 0; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.4); font-weight: 700;
            display: flex; align-items: center; justify-content: center; gap: 12px;
        }
        #toast.show { visibility: visible; opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-xl bg-white shadow-2xl rounded-3xl overflow-hidden border border-slate-100">
        <div class="bg-gradient-to-r from-blue-600 to-indigo-600 p-6 text-white text-center">
            <h1 class="text-2xl font-bold flex justify-center items-center gap-2">
                <i class="fa-brands fa-apple text-white"></i>
                V5: โหมดแก้ปัญหา iPad
            </h1>
            <p class="text-blue-100 text-sm mt-1">วางข้อมูล > แตะ 1 ครั้ง > วางใน GoodNotes ได้เลย</p>
        </div>

        <div class="p-8 space-y-6">
            <div id="input-container">
                <label class="text-slate-700 font-bold text-sm mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-paste text-blue-500"></i> 1. วางข้อมูล 250 งวดที่นี่:
                </label>
                <textarea id="raw-input" rows="4" 
                    class="w-full p-4 border-2 border-slate-200 rounded-2xl focus:border-blue-500 focus:ring-0 font-mono text-sm bg-slate-50 resize-none transition-all" 
                    placeholder="แตะแล้วกด Paste..."></textarea>
            </div>

            <div id="result-area" class="hidden animate-pop">
                <div class="bg-slate-900 rounded-2xl p-6 text-white shadow-xl text-center border-b-4 border-blue-500 relative overflow-hidden">
                    
                    <p class="text-blue-400 text-xs mb-3 uppercase font-bold tracking-widest">2. ระบบคำนวณเรียบร้อย</p>
                    
                    <div class="flex justify-center items-center gap-4 text-5xl font-mono font-black text-white py-6 bg-black/40 rounded-xl border border-slate-700 my-4 shadow-inner">
                        <span id="disp-f1-main">--</span>
                        <span id="disp-f1-rev" class="text-white/50">--</span>
                        <span class="text-slate-600 text-3xl">|</span>
                        <span id="disp-f2-main">--</span>
                        <span id="disp-f2-rev" class="text-white/50">--</span>
                    </div>

                    <button id="ipad-copy-btn" onclick="copyToiPad()" class="w-full py-5 bg-blue-500 hover:bg-blue-600 active:bg-blue-700 text-white rounded-xl font-bold text-xl transition-all shadow-lg shadow-blue-500/30 flex justify-center items-center gap-3 animate-bounce">
                        <i class="fa-solid fa-hand-pointer text-2xl"></i>
                        แตะที่นี่เพื่อก๊อปปี้ 4 คู่
                    </button>
                    <p class="mt-3 text-[11px] text-slate-400">ต้องแตะปุ่มนี้ iPad ถึงจะยอมให้ก๊อปปี้ข้อมูลใหม่ทับของเดิม</p>
                </div>
            </div>

            <div id="error-msg" class="hidden p-4 bg-red-50 text-red-600 rounded-2xl text-sm text-center border border-red-100 font-bold">
                <i class="fa-solid fa-circle-exclamation mr-1"></i> ข้อมูลไม่เพียงพอ กรุณาวางใหม่อีกครั้ง
            </div>
        </div>
    </div>
    
    <div id="toast"><i class="fa-solid fa-circle-check text-2xl"></i><span>ก๊อปปี้ 4 คู่สำเร็จ! วางใน GoodNotes ได้เลย</span></div>

    <script>
        let finalResultText = "";

        // 1. ฟอร์แมตเว้นวรรค 1 เคาะ
        function formatResult(f1, f2) {
            return `${f1.main} ${f1.rev} ${f2.main} ${f2.rev}`;
        }

        // 2. ฟังก์ชันประมวลผล
        function processData() {
            const rawInput = document.getElementById('raw-input');
            const rawText = rawInput.value.trim();
            if (!rawText) return;

            const lines = rawText.split('\n').filter(line => line.trim() !== "");
            const parsed = [];

            lines.forEach(line => {
                const parts = line.trim().split(/\s+/);
                if (parts.length >= 3) {
                    let top = parts[1].replace(/'/g, '').replace(/\D/g, ''); 
                    let bottom = parts[2].replace(/'/g, '').replace(/\D/g, '');
                    if (top.length >= 3 && bottom.length >= 2) {
                        parsed.push({ top: top.slice(-3), bottom: bottom.slice(-2) });
                    }
                }
            });

            if (parsed.length < 2) {
                document.getElementById('error-msg').classList.remove('hidden');
                document.getElementById('result-area').classList.add('hidden');
                return;
            }

            document.getElementById('error-msg').classList.add('hidden');

            const lastIdx = parsed.length - 1;
            const prev1 = parsed[lastIdx-1];
            const prev2 = parsed[lastIdx];

            const resF1 = { 
                main: prev1.top.charAt(1) + prev2.top.charAt(1), 
                rev: prev2.top.charAt(1) + prev1.top.charAt(1) 
            };
            const h1 = parseInt(prev1.top.charAt(0));
            const sum2 = (parseInt(prev2.top.charAt(1)) + parseInt(prev2.top.charAt(2))) % 10;
            const resF2 = { 
                main: h1.toString() + sum2.toString(), 
                rev: sum2.toString() + h1.toString() 
            };

            // แสดงผลลัพธ์
            document.getElementById('disp-f1-main').innerText = resF1.main;
            document.getElementById('disp-f1-rev').innerText = resF1.rev;
            document.getElementById('disp-f2-main').innerText = resF2.main;
            document.getElementById('disp-f2-rev').innerText = resF2.rev;

            // เก็บข้อความรอให้ผู้ใช้กดปุ่ม
            finalResultText = formatResult(resF1, resF2);

            // โชว์ผลลัพธ์
            const resultArea = document.getElementById('result-area');
            resultArea.classList.remove('hidden');

            // **ไม้ตาย:** เคลียร์ข้อมูล 250 งวดทิ้งจากกล่องทันที เพื่อทำลายข้อมูลเก่าทิ้ง
            rawInput.value = "";
            
            // เลื่อนจอลงมาที่ปุ่มก๊อปปี้
            setTimeout(() => {
                resultArea.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }, 100);
        }

        // 3. ฟังก์ชันก๊อปปี้ (ต้องสั่งงานจากการกดปุ่มเท่านั้น)
        function copyToiPad() {
            if (!finalResultText) return;

            // ใช้ Clipboard API สมัยใหม่ที่รองรับบน iOS ดีที่สุด
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(finalResultText).then(() => {
                    triggerSuccessUI();
                }).catch(err => {
                    fallbackCopy();
                });
            } else {
                fallbackCopy();
            }
        }

        // กรณีฉุกเฉิน
        function fallbackCopy() {
            const textArea = document.createElement("textarea");
            textArea.value = finalResultText;
            textArea.style.position = "fixed";
            textArea.style.left = "-999999px";
            textArea.style.top = "-999999px";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            
            try {
                document.execCommand('copy');
                triggerSuccessUI();
            } catch (err) {
                alert("เกิดข้อผิดพลาดในการคัดลอก กรุณาลองใหม่อีกครั้ง");
            }
            textArea.remove();
        }

        function triggerSuccessUI() {
            const btn = document.getElementById('ipad-copy-btn');
            const originalHTML = btn.innerHTML;
            
            // เปลี่ยนสีปุ่มให้รู้ว่ากดติดแล้ว
            btn.innerHTML = '<i class="fa-solid fa-check-double text-2xl"></i> คัดลอกสำเร็จ!';
            btn.classList.replace('bg-blue-500', 'bg-emerald-500');
            btn.classList.replace('hover:bg-blue-600', 'hover:bg-emerald-600');
            btn.classList.replace('shadow-blue-500/30', 'shadow-emerald-500/30');
            btn.classList.remove('animate-bounce');

            const toast = document.getElementById("toast");
            toast.classList.add("show");

            setTimeout(() => { 
                toast.classList.remove("show"); 
                btn.innerHTML = originalHTML;
                btn.classList.replace('bg-emerald-500', 'bg-blue-500');
                btn.classList.replace('hover:bg-emerald-600', 'hover:bg-blue-600');
                btn.classList.replace('shadow-emerald-500/30', 'shadow-blue-500/30');
                btn.classList.add('animate-bounce');
            }, 3000);
        }

        // 4. ทริกเกอร์การคำนวณทันทีที่วาง
        let debounceTimer;
        document.getElementById('raw-input').addEventListener('input', function() {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                if (this.value.trim().length > 10) {
                    processData();
                }
            }, 400); // รอ 400ms ให้ข้อมูลลงครบ
        });
    </script>
</body>
</html>
