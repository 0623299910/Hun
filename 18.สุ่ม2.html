<!doctype html>
<html lang="th">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เครื่องสุ่มตัวเลข</title>
  <script src="/_sdk/element_sdk.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&amp;family=Sarabun:wght@400;600;700&amp;display=swap" rel="stylesheet">
  <style>
    body {
      box-sizing: border-box;
    }
    
    * {
      font-family: 'Sarabun', 'Noto Sans Thai', system-ui, -apple-system, sans-serif;
      outline: none; /* Remove default focus outline */
    }
    
    @keyframes spin {
      0% { transform: rotateY(0deg); }
      100% { transform: rotateY(360deg); }
    }
    
    .spinning {
      animation: spin 0.5s ease-in-out;
    }
    
    .paklak-option input:checked + span {
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      border-radius: 0.5rem;
      padding: 0.5rem;
    }
    
    .paklak-option:has(input:checked) {
      background: linear-gradient(to bottom right, #10b981, #059669) !important;
    }

    /* Add transform transition for button press effect */
    .btn-press-effect {
      transform: scale(0.95);
      transition: transform 0.1s;
    }
  </style>
  <style>@view-transition { navigation: auto; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
 </head>
 <body class="w-full min-h-full flex items-center justify-center p-6">
  <div class="w-full max-w-4xl bg-gradient-to-br from-purple-500 to-indigo-600 rounded-3xl shadow-2xl p-8"><!-- Navigation Tabs -->
   <div class="flex gap-4 mb-8 justify-center"><button id="tab-random" class="tab-btn bg-white text-purple-600 font-bold py-3 px-8 rounded-full shadow-lg transition-all duration-200"> สุ่มตัวเลข </button> <button id="tab-paklak" class="tab-btn bg-purple-400 bg-opacity-50 text-white font-bold py-3 px-8 rounded-full transition-all duration-200"> สุ่มปักหลัก </button>
   </div>
   <h1 id="main-title" class="text-white text-center mb-12 font-bold">เครื่องสุ่มตัวเลข</h1><!-- Page 1: Random Numbers -->
   <div id="page-random" class="page-content">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10"><!-- ชุดที่ 1: 0-9 -->
     <div class="bg-white rounded-2xl p-6 shadow-lg"><label id="set1-label" class="block text-center text-gray-700 font-semibold mb-4">ชุดที่ 1</label>
      <div class="bg-gradient-to-br from-pink-100 to-pink-200 rounded-xl p-8 flex items-center justify-center min-h-32"><span id="result1" class="text-gray-400 font-bold">?</span>
      </div>
      <p class="text-center text-gray-500 text-sm mt-3">สุ่มเลข 0-9</p>
     </div><!-- ชุดที่ 2: 0-9 -->
     <div class="bg-white rounded-2xl p-6 shadow-lg"><label id="set2-label" class="block text-center text-gray-700 font-semibold mb-4">ชุดที่ 2</label>
      <div class="bg-gradient-to-br from-blue-100 to-blue-200 rounded-xl p-8 flex items-center justify-center min-h-32"><span id="result2" class="text-gray-400 font-bold">?</span>
      </div>
      <p class="text-center text-gray-500 text-sm mt-3">สุ่มเลข 0-9</p>
     </div><!-- ชุดที่ 3: 00-99 -->
     <div class="bg-white rounded-2xl p-6 shadow-lg"><label id="set3-label" class="block text-center text-gray-700 font-semibold mb-4">ชุดที่ 3</label>
      <div class="bg-gradient-to-br from-green-100 to-green-200 rounded-xl p-8 flex items-center justify-center min-h-32"><span id="result3" class="text-gray-400 font-bold">??</span>
      </div>
      <p class="text-center text-gray-500 text-sm mt-3">สุ่มเลข 00-99</p>
     </div>
    </div>
    <div class="flex justify-center"><button id="random-btn" class="bg-white text-purple-600 font-bold py-4 px-12 rounded-full shadow-lg hover:shadow-xl hover:scale-105 transition-all duration-200 transform"> สุ่มตัวเลข (Enter) </button>
    </div>
   </div><!-- Page 2: Paklak Random -->
   <div id="page-paklak" class="page-content" style="display: none;">
    <div class="bg-white rounded-2xl p-8 shadow-lg mb-6">
     <h2 class="text-center text-gray-700 font-bold text-2xl mb-6">ตัวเลือกสุ่มปักหลัก</h2>
     <div class="grid grid-cols-4 sm:grid-cols-5 gap-3 mb-8"><label class="paklak-option bg-gradient-to-br from-pink-100 to-pink-200 rounded-lg p-4 cursor-pointer hover:shadow-md transition-all text-center"> <input type="checkbox" value="s0" class="paklak-checkbox hidden"> <span class="block font-bold text-gray-700">s0</span> </label> <label class="paklak-option bg-gradient-to-br from-pink-100 to-pink-200 rounded-lg p-4 cursor-pointer hover:shadow-md transition-all text-center"> <input type="checkbox" value="s1" class="paklak-checkbox hidden"> <span class="block font-bold text-gray-700">s1</span> </label> <label class="paklak-option bg-gradient-to-br from-pink-100 to-pink-200 rounded-lg p-4 cursor-pointer hover:shadow-md transition-all text-center"> <input type="checkbox" value="s2" class="paklak-checkbox hidden"> <span class="block font-bold text-gray-700">s2</span> </label> <label class="paklak-option bg-gradient-to-br from-pink-100 to-pink-200 rounded-lg p-4 cursor-pointer hover:shadow-md transition-all text-center"> <input type="checkbox" value="s3" class="paklak-checkbox hidden"> <span class="block font-bold text-gray-700">s3</span> </label> <label class="paklak-option bg-gradient-to-br from-pink-100 to-pink-200 rounded-lg p-4 cursor-pointer hover:shadow-md transition-all text-center"> <input type="checkbox" value="s4" class="paklak-checkbox hidden"> <span class="block font-bold text-gray-700">s4</span> </label> <label class="paklak-option bg-gradient-to-br from-pink-100 to-pink-200 rounded-lg p-4 cursor-pointer hover:shadow-md transition-all text-center"> <input type="checkbox" value="s5" class="paklak-checkbox hidden"> <span class="block font-bold text-gray-700">s5</span> </label> <label class="paklak-option bg-gradient-to-br from-pink-100 to-pink-200 rounded-lg p-4 cursor-pointer hover:shadow-md transition-all text-center"> <input type="checkbox" value="s6" class="paklak-checkbox hidden"> <span class="block font-bold text-gray-700">s6</span> </label> <label class="paklak-option bg-gradient-to-br from-pink-100 to-pink-200 rounded-lg p-4 cursor-pointer hover:shadow-md transition-all text-center"> <input type="checkbox" value="s7" class="paklak-checkbox hidden"> <span class="block font-bold text-gray-700">s7</span> </label> <label class="paklak-option bg-gradient-to-br from-pink-100 to-pink-200 rounded-lg p-4 cursor-pointer hover:shadow-md transition-all text-center"> <input type="checkbox" value="s8" class="paklak-checkbox hidden"> <span class="block font-bold text-gray-700">s8</span> </label> <label class="paklak-option bg-gradient-to-br from-pink-100 to-pink-200 rounded-lg p-4 cursor-pointer hover:shadow-md transition-all text-center"> <input type="checkbox" value="s9" class="paklak-checkbox hidden"> <span class="block font-bold text-gray-700">s9</span> </label> <label class="paklak-option bg-gradient-to-br from-blue-100 to-blue-200 rounded-lg p-4 cursor-pointer hover:shadow-md transition-all text-center"> <input type="checkbox" value="n0" class="paklak-checkbox hidden"> <span class="block font-bold text-gray-700">n0</span> </label> <label class="paklak-option bg-gradient-to-br from-blue-100 to-blue-200 rounded-lg p-4 cursor-pointer hover:shadow-md transition-all text-center"> <input type="checkbox" value="n1" class="paklak-checkbox hidden"> <span class="block font-bold text-gray-700">n1</span> </label> <label class="paklak-option bg-gradient-to-br from-blue-100 to-blue-200 rounded-lg p-4 cursor-pointer hover:shadow-md transition-all text-center"> <input type="checkbox" value="n2" class="paklak-checkbox hidden"> <span class="block font-bold text-gray-700">n2</span> </label> <label class="paklak-option bg-gradient-to-br from-blue-100 to-blue-200 rounded-lg p-4 cursor-pointer hover:shadow-md transition-all text-center"> <input type="checkbox" value="n3" class="paklak-checkbox hidden"> <span class="block font-bold text-gray-700">n3</span> </label> <label class="paklak-option bg-gradient-to-br from-blue-100 to-blue-200 rounded-lg p-4 cursor-pointer hover:shadow-md transition-all text-center"> <input type="checkbox" value="n4" class="paklak-checkbox hidden"> <span class="block font-bold text-gray-700">n4</span> </label> <label class="paklak-option bg-gradient-to-br from-blue-100 to-blue-200 rounded-lg p-4 cursor-pointer hover:shadow-md transition-all text-center"> <input type="checkbox" value="n5" class="paklak-checkbox hidden"> <span class="block font-bold text-gray-700">n5</span> </label> <label class="paklak-option bg-gradient-to-br from-blue-100 to-blue-200 rounded-lg p-4 cursor-pointer hover:shadow-md transition-all text-center"> <input type="checkbox" value="n6" class="paklak-checkbox hidden"> <span class="block font-bold text-gray-700">n6</span> </label> <label class="paklak-option bg-gradient-to-br from-blue-100 to-blue-200 rounded-lg p-4 cursor-pointer hover:shadow-md transition-all text-center"> <input type="checkbox" value="n7" class="paklak-checkbox hidden"> <span class="block font-bold text-gray-700">n7</span> </label> <label class="paklak-option bg-gradient-to-br from-blue-100 to-blue-200 rounded-lg p-4 cursor-pointer hover:shadow-md transition-all text-center"> <input type="checkbox" value="n8" class="paklak-checkbox hidden"> <span class="block font-bold text-gray-700">n8</span> </label> <label class="paklak-option bg-gradient-to-br from-blue-100 to-blue-200 rounded-lg p-4 cursor-pointer hover:shadow-md transition-all text-center"> <input type="checkbox" value="n9" class="paklak-checkbox hidden"> <span class="block font-bold text-gray-700">n9</span> </label>
     </div>
     <div class="bg-gradient-to-br from-green-100 to-green-200 rounded-xl p-8 mb-6 text-center min-h-32 flex items-center justify-center"><span id="paklak-result" class="text-gray-400 font-bold text-6xl">?</span>
     </div>
     <div class="flex flex-wrap justify-center gap-4"><button id="select-all-btn" class="bg-purple-500 text-white font-bold py-3 px-8 rounded-full hover:bg-purple-600 transition-all duration-200"> เลือกทั้งหมด </button> <button id="clear-all-btn" class="bg-gray-400 text-white font-bold py-3 px-8 rounded-full hover:bg-gray-500 transition-all duration-200"> ล้างทั้งหมด </button> <button id="paklak-random-btn" class="bg-white text-purple-600 font-bold py-3 px-8 rounded-full shadow-lg hover:shadow-xl hover:scale-105 transition-all duration-200 transform"> สุ่มปักหลัก (Enter) </button>
     </div>
    </div>
   </div>
  </div>
  <script>
    const defaultConfig = {
      background_color: "#a855f7",
      surface_color: "#ffffff",
      text_color: "#374151",
      primary_action_color: "#ffffff",
      secondary_action_color: "#9333ea",
      font_family: "Sarabun",
      font_size: 16,
      main_title: "เครื่องสุ่มตัวเลข",
      set1_label: "ชุดที่ 1",
      set2_label: "ชุดที่ 2",
      set3_label: "ชุดที่ 3",
      button_text: "สุ่มตัวเลข"
    };

    async function onConfigChange(config) {
      const baseFont = config.font_family || defaultConfig.font_family;
      const baseFontSize = config.font_size || defaultConfig.font_size;
      const backgroundColor = config.background_color || defaultConfig.background_color;
      const surfaceColor = config.surface_color || defaultConfig.surface_color;
      const textColor = config.text_color || defaultConfig.text_color;
      const primaryActionColor = config.primary_action_color || defaultConfig.primary_action_color;
      const secondaryActionColor = config.secondary_action_color || defaultConfig.secondary_action_color;
      
      // Apply font
      document.body.style.fontFamily = `${baseFont}, 'Sarabun', 'Noto Sans Thai', system-ui, -apple-system, sans-serif`;
      
      // Apply colors
      const container = document.querySelector('.bg-gradient-to-br');
      container.style.background = `linear-gradient(to bottom right, ${backgroundColor}, ${secondaryActionColor})`;
      
      const cards = document.querySelectorAll('.bg-white.rounded-2xl');
      cards.forEach(card => {
        card.style.backgroundColor = surfaceColor;
      });
      
      const labels = document.querySelectorAll('.text-gray-700');
      labels.forEach(label => {
        label.style.color = textColor;
      });
      
      const button = document.getElementById('random-btn');
      button.style.backgroundColor = primaryActionColor;
      button.style.color = secondaryActionColor;
      
      const paklakRandomBtn = document.getElementById('paklak-random-btn');
      paklakRandomBtn.style.backgroundColor = primaryActionColor;
      paklakRandomBtn.style.color = secondaryActionColor;
      
      // Apply font sizes
      const title = document.getElementById('main-title');
      title.style.fontSize = `${baseFontSize * 2}px`;
      title.textContent = config.main_title || defaultConfig.main_title;
      
      const set1Label = document.getElementById('set1-label');
      set1Label.style.fontSize = `${baseFontSize * 1.125}px`;
      set1Label.textContent = config.set1_label || defaultConfig.set1_label;
      
      const set2Label = document.getElementById('set2-label');
      set2Label.style.fontSize = `${baseFontSize * 1.125}px`;
      set2Label.textContent = config.set2_label || defaultConfig.set2_label;
      
      const set3Label = document.getElementById('set3-label');
      set3Label.style.fontSize = `${baseFontSize * 1.125}px`;
      set3Label.textContent = config.set3_label || defaultConfig.set3_label;
      
      // Update button text logic to include "(Enter)"
      const baseButtonText = config.button_text || defaultConfig.button_text;
      button.style.fontSize = `${baseFontSize * 1.125}px`;
      button.textContent = `${baseButtonText} (Enter)`;
      
      const results = document.querySelectorAll('#result1, #result2, #result3');
      results.forEach(result => {
        result.style.fontSize = `${baseFontSize * 4}px`;
      });
      
      const descriptions = document.querySelectorAll('.text-gray-500.text-sm');
      descriptions.forEach(desc => {
        desc.style.fontSize = `${baseFontSize * 0.875}px`;
      });
      
      const tabButtons = document.querySelectorAll('.tab-btn');
      tabButtons.forEach(btn => {
        btn.style.fontSize = `${baseFontSize * 1}px`;
      });
      
      const paklakTitle = document.querySelector('#page-paklak h2');
      paklakTitle.style.fontSize = `${baseFontSize * 1.5}px`;
      
      const paklakResult = document.getElementById('paklak-result');
      paklakResult.style.fontSize = `${baseFontSize * 3.75}px`;
      
      const utilityButtons = document.querySelectorAll('#select-all-btn, #clear-all-btn, #paklak-random-btn');
      utilityButtons.forEach(btn => {
        btn.style.fontSize = `${baseFontSize * 1}px`;
      });
    }

    if (window.elementSdk) {
      window.elementSdk.init({
        defaultConfig,
        onConfigChange,
        mapToCapabilities: (config) => ({
          recolorables: [
            {
              get: () => config.background_color || defaultConfig.background_color,
              set: (value) => {
                config.background_color = value;
                window.elementSdk.setConfig({ background_color: value });
              }
            },
            {
              get: () => config.surface_color || defaultConfig.surface_color,
              set: (value) => {
                config.surface_color = value;
                window.elementSdk.setConfig({ surface_color: value });
              }
            },
            {
              get: () => config.text_color || defaultConfig.text_color,
              set: (value) => {
                config.text_color = value;
                window.elementSdk.setConfig({ text_color: value });
              }
            },
            {
              get: () => config.primary_action_color || defaultConfig.primary_action_color,
              set: (value) => {
                config.primary_action_color = value;
                window.elementSdk.setConfig({ primary_action_color: value });
              }
            },
            {
              get: () => config.secondary_action_color || defaultConfig.secondary_action_color,
              set: (value) => {
                config.secondary_action_color = value;
                window.elementSdk.setConfig({ secondary_action_color: value });
              }
            }
          ],
          borderables: [],
          fontEditable: {
            get: () => config.font_family || defaultConfig.font_family,
            set: (value) => {
              config.font_family = value;
              window.elementSdk.setConfig({ font_family: value });
            }
          },
          fontSizeable: {
            get: () => config.font_size || defaultConfig.font_size,
            set: (value) => {
              config.font_size = value;
              window.elementSdk.setConfig({ font_size: value });
            }
          }
        }),
        mapToEditPanelValues: (config) => new Map([
          ["main_title", config.main_title || defaultConfig.main_title],
          ["set1_label", config.set1_label || defaultConfig.set1_label],
          ["set2_label", config.set2_label || defaultConfig.set2_label],
          ["set3_label", config.set3_label || defaultConfig.set3_label],
          ["button_text", config.button_text || defaultConfig.button_text]
        ])
      });
    }

    // Tab navigation
    const tabRandom = document.getElementById('tab-random');
    const tabPaklak = document.getElementById('tab-paklak');
    const pageRandom = document.getElementById('page-random');
    const pagePaklak = document.getElementById('page-paklak');

    function switchTab(showRandom) {
      if (showRandom) {
        pageRandom.style.display = 'block';
        pagePaklak.style.display = 'none';
        tabRandom.className = 'tab-btn bg-white text-purple-600 font-bold py-3 px-8 rounded-full shadow-lg transition-all duration-200';
        tabPaklak.className = 'tab-btn bg-purple-400 bg-opacity-50 text-white font-bold py-3 px-8 rounded-full transition-all duration-200';
      } else {
        pageRandom.style.display = 'none';
        pagePaklak.style.display = 'block';
        tabPaklak.className = 'tab-btn bg-white text-purple-600 font-bold py-3 px-8 rounded-full shadow-lg transition-all duration-200';
        tabRandom.className = 'tab-btn bg-purple-400 bg-opacity-50 text-white font-bold py-3 px-8 rounded-full transition-all duration-200';
      }
    }

    tabRandom.addEventListener('click', () => switchTab(true));
    tabPaklak.addEventListener('click', () => switchTab(false));

    // Random number functionality
    const randomBtn = document.getElementById('random-btn');
    const result1 = document.getElementById('result1');
    const result2 = document.getElementById('result2');
    const result3 = document.getElementById('result3');

    randomBtn.addEventListener('click', () => {
      // Prevent double clicking while spinning
      if(result1.classList.contains('spinning')) return;

      result1.classList.add('spinning');
      result2.classList.add('spinning');
      result3.classList.add('spinning');
      
      setTimeout(() => {
        const random1 = Math.floor(Math.random() * 10);
        const random2 = Math.floor(Math.random() * 10);
        const random3 = Math.floor(Math.random() * 100);
        
        result1.textContent = random1;
        result2.textContent = random2;
        result3.textContent = random3.toString().padStart(2, '0');
        
        result1.classList.remove('spinning');
        result2.classList.remove('spinning');
        result3.classList.remove('spinning');
      }, 500);
    });

    // Paklak functionality
    const paklakCheckboxes = document.querySelectorAll('.paklak-checkbox');
    const paklakOptions = document.querySelectorAll('.paklak-option');
    const paklakResult = document.getElementById('paklak-result');
    const selectAllBtn = document.getElementById('select-all-btn');
    const clearAllBtn = document.getElementById('clear-all-btn');
    const paklakRandomBtn = document.getElementById('paklak-random-btn');

    paklakOptions.forEach((option, index) => {
      option.addEventListener('click', () => {
        paklakCheckboxes[index].checked = !paklakCheckboxes[index].checked;
      });
    });

    selectAllBtn.addEventListener('click', () => {
      paklakCheckboxes.forEach(checkbox => {
        checkbox.checked = true;
      });
    });

    clearAllBtn.addEventListener('click', () => {
      paklakCheckboxes.forEach(checkbox => {
        checkbox.checked = false;
      });
    });

    paklakRandomBtn.addEventListener('click', () => {
      // Prevent double clicking while spinning
      if(paklakResult.classList.contains('spinning')) return;

      const selectedOptions = Array.from(paklakCheckboxes)
        .filter(checkbox => checkbox.checked)
        .map(checkbox => checkbox.value);

      if (selectedOptions.length === 0) {
        paklakResult.textContent = '❌';
        paklakResult.style.color = '#ef4444';
        setTimeout(() => {
          paklakResult.textContent = '?';
          paklakResult.style.color = '#9ca3af';
        }, 1500);
        return;
      }

      paklakResult.classList.add('spinning');

      setTimeout(() => {
        const randomIndex = Math.floor(Math.random() * selectedOptions.length);
        const randomChoice = selectedOptions[randomIndex];
        
        paklakResult.textContent = randomChoice;
        paklakResult.style.color = '#059669';
        paklakResult.classList.remove('spinning');
      }, 500);
    });

    // Handle Enter Key Press Globally
    document.addEventListener('keydown', function(event) {
        if (event.key === 'Enter') {
            event.preventDefault(); // Prevent default browser action
            
            // Determine active button based on visible page
            let activeBtn;
            if (pagePaklak.style.display !== 'none') {
                activeBtn = paklakRandomBtn;
            } else {
                activeBtn = randomBtn;
            }
            
            // Add visual press effect class
            activeBtn.classList.add('btn-press-effect');
            
            // Remove effect after short delay
            setTimeout(() => {
                activeBtn.classList.remove('btn-press-effect');
            }, 100);

            // Trigger click
            activeBtn.click();
        }
    });
  </script>
 </body>
</html>
