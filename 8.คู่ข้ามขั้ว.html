<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>โปรแกรมวิเคราะห์หวย - Super Formula (Auto-Process Mode)</title>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f1f5f9; }
        .font-display { font-family: 'Chakra Petch', sans-serif; }
        .fade-in { animation: fadeIn 0.4s ease-in-out; }
        .slide-up { animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- Icons Component ---
        const Icon = ({ name, className }) => {
            const icons = {
                upload: <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>,
                trash: <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>,
                play: <path d="M5 3l14 9-14 9V3z"/>,
                refresh: <path d="M23 4v6h-6M1 20v-6h6M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>,
                check: <path d="M20 6L9 17l-5-5"/>,
                alert: <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0zM12 9v4m0 4h.01"/>,
                chart: <path d="M18 20V10M12 20V4M6 20v-6"/>,
                star: <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>,
                dead: <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z M12 8v4 M12 16h.01"/>
            };
            return (
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {icons[name]}
                </svg>
            );
        };

        const App = () => {
            const [view, setView] = useState('input');
            const [inputText, setInputText] = useState('');
            const [dataList, setDataList] = useState([]);
            const [activeTab, setActiveTab] = useState('formula1');
            const debounceTimer = useRef(null);

            const handleAnalyze = (textToProcess = inputText) => {
                if (!textToProcess.trim()) return;
                const lines = textToProcess.trim().split('\n');
                const parsed = [];
                
                lines.forEach((line, index) => {
                    const parts = line.trim().split(/\s+/);
                    if (parts.length >= 3) {
                        const top = parts[1].replace(/'/g, '');
                        const bottom = parts[2].replace(/'/g, '');
                        
                        if(top.length === 3 && bottom.length === 2) {
                            parsed.push({ index, date: parts[0], top, bottom });
                        }
                    }
                });

                if (parsed.length < 4) {
                    // สำหรับ Auto-Process จะไม่ alert เพื่อไม่ให้กวนผู้ใช้ขณะพิมพ์ 
                    // แต่ถ้ากดปุ่ม Analyze เองจะแจ้งเตือนปกติ
                    if (view === 'input' && !inputText) return;
                    return;
                }
                setDataList(parsed);
                setView('analysis');
            };

            // ระบบ Auto-Calculate on Input/Paste with Debounce
            useEffect(() => {
                if (view === 'input' && inputText.trim().length > 20) {
                    if (debounceTimer.current) clearTimeout(debounceTimer.current);
                    
                    debounceTimer.current = setTimeout(() => {
                        handleAnalyze(inputText);
                    }, 800); // 800ms Debounce
                }
                return () => clearTimeout(debounceTimer.current);
            }, [inputText]);

            const handleClear = () => {
                if (confirm('ยืนยันล้างข้อมูลทั้งหมด?')) {
                    setInputText('');
                    setDataList([]);
                    setView('input');
                }
            };

            const rowCount = useMemo(() => {
                return inputText.trim().split('\n').filter(l => l.trim().length > 0).length;
            }, [inputText]);

            return (
                <div className="min-h-screen flex flex-col items-center py-6 px-4">
                    {view === 'input' ? (
                        <InputScreen 
                            inputText={inputText} 
                            setInputText={setInputText} 
                            handleAnalyze={() => handleAnalyze(inputText)} 
                            handleClear={() => setInputText('')}
                            rowCount={rowCount}
                        />
                    ) : (
                        <AnalysisScreen 
                            data={dataList} 
                            handleClear={handleClear}
                            activeTab={activeTab}
                            setActiveTab={setActiveTab}
                        />
                    )}
                </div>
            );
        };

            const InputScreen = ({ inputText, setInputText, handleAnalyze, handleClear, rowCount }) => {
            const handlePaste = (e) => {
                // ระบบตรวจจับการ Paste เพื่อเตรียมประมวลผลทันทีผ่าน useEffect
                const pastedData = e.clipboardData.getData('Text');
                if (pastedData) {
                    console.log("Detecting paste... Auto-processing starts shortly.");
                }
            };

            return (
                <div className="w-full max-w-3xl bg-white rounded-3xl shadow-xl overflow-hidden fade-in">
                    <div className="bg-gradient-to-r from-slate-800 to-indigo-900 p-6 text-white flex justify-between items-center">
                        <div className="flex items-center gap-4">
                            <div className="bg-white/20 p-3 rounded-xl"><Icon name="upload" className="w-6 h-6" /></div>
                            <div>
                                <h1 className="text-2xl font-bold">ระบบวิเคราะห์หวย</h1>
                                <p className="text-indigo-100 text-sm">วางข้อมูลปุ๊บ วิเคราะห์ปั๊บ อัตโนมัติ</p>
                            </div>
                        </div>
                    </div>
                    <div className="p-6 space-y-4">
                        <div className="text-sm text-slate-500 bg-slate-50 p-4 rounded-xl border border-slate-200">
                            <span className="font-bold text-slate-700">โหมดอัตโนมัติ:</span> วางข้อมูลจาก Excel ลงในช่องด้านล่าง ระบบจะคำนวณและสลับหน้าให้อัตโนมัติ
                        </div>
                        <textarea
                            value={inputText}
                            onPaste={handlePaste}
                            onChange={(e) => setInputText(e.target.value)}
                            placeholder={`ตัวอย่าง:\n2026-01-01\t'860\t'00\n2026-01-02\t'201\t'41`}
                            className="w-full h-64 p-4 border-2 border-slate-200 rounded-xl focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100 outline-none font-mono text-sm resize-none bg-slate-50 text-slate-700 transition-all"
                        ></textarea>
                        <div className="flex justify-between items-center">
                            <div className="flex items-center gap-2 text-sm font-semibold">
                                {rowCount > 0 ? <span className="text-green-500 flex items-center gap-1"><Icon name="check" className="w-4 h-4"/> พร้อมใช้งาน</span> : <span className="text-slate-400">รอข้อมูล...</span>}
                                <span className="bg-slate-100 text-slate-600 px-2 py-1 rounded-md border border-slate-200">จำนวน: {rowCount} งวด</span>
                            </div>
                            <button onClick={handleClear} disabled={!inputText} className="text-red-400 hover:text-red-600 text-sm flex items-center gap-1 transition-colors disabled:opacity-50"><Icon name="trash" className="w-4 h-4"/> ล้างข้อมูล</button>
                        </div>
                        <button
                            onClick={handleAnalyze}
                            disabled={rowCount < 4}
                            className={`w-full py-4 rounded-xl font-bold text-lg flex items-center justify-center gap-2 shadow-lg transition-all transform active:scale-[0.98] ${rowCount >= 4 ? 'bg-indigo-600 text-white hover:bg-indigo-700 hover:shadow-indigo-500/30' : 'bg-slate-200 text-slate-400 cursor-not-allowed'}`}
                        >
                            <Icon name="play" className="w-5 h-5"/> คำนวณสูตรแมนนวล
                        </button>
                    </div>
                </div>
            );
        };

        const AnalysisScreen = ({ data, handleClear, activeTab, setActiveTab }) => {
            
            // --- Formula 1 Logic ---
            const { resultsF1, predictionF1 } = useMemo(() => {
                const res = [];
                for (let i = 3; i < data.length; i++) {
                    const target = data[i];
                    const d1 = data[i - 3].top.slice(-1);
                    const d2 = data[i - 1].bottom.slice(-1);
                    const actual = target.bottom;
                    const isDoubleHit = actual.includes(d1) && actual.includes(d2);
                    res.push({ targetDate: target.date, targetBottom: actual, d1, d2, isDoubleHit });
                }
                const last = data.length;
                let pred = null;
                if (data.length >= 3) {
                    pred = { d1: data[last - 3].top.slice(-1), d2: data[last - 1].bottom.slice(-1), s1D: data[last - 3].date, s2D: data[last - 1].date };
                }
                return { resultsF1: res.reverse(), predictionF1: pred };
            }, [data]);

            // --- Formula 2 Logic ---
            const { resultsF2, predictionF2 } = useMemo(() => {
                const res = [];
                for (let i = 0; i < data.length - 1; i++) {
                    const curr = data[i];
                    const next = data[i + 1];
                    const d1 = (parseInt(curr.top[0]) - 1 + 10) % 10;
                    const d2 = (parseInt(curr.top[2]) - 1 + 10) % 10;
                    const actual = next.bottom;
                    const isDoubleHit = actual.includes(d1.toString()) && actual.includes(d2.toString());
                    res.push({ date: curr.date, nextDate: next.date, nextBottom: actual, d1, d2, isDoubleHit });
                }
                const last = data[data.length - 1];
                const pD1 = (parseInt(last.top[0]) - 1 + 10) % 10;
                const pD2 = (parseInt(last.top[2]) - 1 + 10) % 10;
                return { resultsF2: res.reverse(), predictionF2: { sourceDate: last.date, d1: pD1, d2: pD2 } };
            }, [data]);

            // --- Formula 3 Logic (Z-Score / Dead Numbers) ---
            const { statsF3, deadNumbersF3 } = useMemo(() => {
                const stats = Array.from({length: 10}, (_, i) => ({ num: i, count: 0, gap: 0, lastIndex: -1 }));
                const total = data.length;
                
                // Count Frequency & Find Last Index
                data.forEach((draw, idx) => {
                    const bottom = draw.bottom;
                    for (let char of bottom) {
                        const d = parseInt(char);
                        if (!isNaN(d)) {
                            stats[d].count++;
                            stats[d].lastIndex = idx;
                        }
                    }
                });

                // Calculate Gap (Distance from end)
                stats.forEach(s => {
                    s.gap = s.lastIndex === -1 ? total : (total - 1 - s.lastIndex);
                });

                // Z-Score
                const counts = stats.map(s => s.count);
                const mean = counts.reduce((a, b) => a + b, 0) / 10;
                const stdDev = Math.sqrt(counts.reduce((a, b) => a + Math.pow(b - mean, 2), 0) / 10);

                // Final Score Calculation
                const lastDraw = data[total - 1].bottom;
                stats.forEach(s => {
                    s.zScore = stdDev === 0 ? 0 : (s.count - mean) / stdDev;
                    const recencyBonus = lastDraw.includes(s.num.toString()) ? 20 : 0;
                    s.finalScore = (s.zScore * 15) + (s.gap * 5) + recencyBonus;
                });

                // Sort by Score Descending (Higher Score = More "Dead")
                stats.sort((a, b) => b.finalScore - a.finalScore);

                return { statsF3: stats, deadNumbersF3: [stats[0], stats[1]] };
            }, [data]);

            return (
                <div className="w-full max-w-4xl space-y-6 slide-up">
                    
                    {/* Header */}
                    <div className="bg-white rounded-2xl p-4 flex flex-col sm:flex-row justify-between items-center shadow-sm border-l-4 border-slate-700 gap-4">
                        <div>
                            <h2 className="text-xl font-bold text-slate-800">ผลวิเคราะห์รวม (3 สูตร)</h2>
                            <p className="text-xs text-slate-500">ฐานข้อมูล: {data.length} งวด</p>
                        </div>
                        <button onClick={handleClear} className="px-4 py-2 bg-red-50 text-red-600 rounded-lg text-sm font-bold hover:bg-red-100 transition flex items-center gap-2">
                            <Icon name="refresh" className="w-4 h-4"/> เริ่มใหม่
                        </button>
                    </div>

                    {/* Tabs */}
                    <div className="flex bg-white p-1.5 rounded-2xl shadow-sm border border-slate-200 overflow-x-auto">
                        <button onClick={() => setActiveTab('formula1')} className={`flex-1 py-3 px-2 rounded-xl text-sm font-bold flex items-center justify-center gap-2 transition-all whitespace-nowrap ${activeTab === 'formula1' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-500 hover:bg-slate-50'}`}>
                            <span className="hidden sm:inline bg-white/20 px-2 py-0.5 rounded text-xs">สูตร 1</span> ตัดเลข (น.บน-3)
                        </button>
                        <button onClick={() => setActiveTab('formula2')} className={`flex-1 py-3 px-2 rounded-xl text-sm font-bold flex items-center justify-center gap-2 transition-all whitespace-nowrap ${activeTab === 'formula2' ? 'bg-teal-600 text-white shadow-md' : 'text-slate-500 hover:bg-slate-50'}`}>
                            <span className="hidden sm:inline bg-white/20 px-2 py-0.5 rounded text-xs">สูตร 2</span> ตัดเลข (ร-1, น-1)
                        </button>
                        <button onClick={() => setActiveTab('formula3')} className={`flex-1 py-3 px-2 rounded-xl text-sm font-bold flex items-center justify-center gap-2 transition-all whitespace-nowrap ${activeTab === 'formula3' ? 'bg-rose-600 text-white shadow-md' : 'text-slate-500 hover:bg-slate-50'}`}>
                            <span className="hidden sm:inline bg-white/20 px-2 py-0.5 rounded text-xs">สูตร 3</span> <Icon name="dead" className="w-4 h-4"/> เลขดับ Z-Score
                        </button>
                    </div>

                    {/* Content */}
                    <div className="fade-in">
                        {activeTab === 'formula1' && <FormulaView results={resultsF1} prediction={predictionF1} color="indigo" title="สูตร 1: ตัดเลข" isF2={false} />}
                        {activeTab === 'formula2' && <FormulaView results={resultsF2} prediction={predictionF2} color="teal" title="สูตร 2: ตัดเลข (ร้อย-1, หน่วย-1)" isF2={true} />}
                        {activeTab === 'formula3' && <Formula3View stats={statsF3} deadNumbers={deadNumbersF3} />}
                    </div>
                </div>
            );
        };

        const FormulaView = ({ results, prediction, color, title, isF2 }) => {
            const bgGradient = color === 'indigo' ? 'from-indigo-800 to-blue-900' : 'from-teal-700 to-emerald-900';
            const textVal = color === 'indigo' ? 'text-indigo-600' : 'text-teal-600';

            return (
                <div className="space-y-6">
                    {prediction && (
                        <div className={`bg-gradient-to-br ${bgGradient} rounded-3xl shadow-xl p-8 text-white relative overflow-hidden text-center`}>
                            <div className="relative z-10">
                                <h3 className="text-white/70 text-xs font-bold uppercase tracking-widest mb-4">แนวทางงวดถัดไป ({title})</h3>
                                <div className="flex justify-center items-center gap-8 mb-6">
                                    <div className="text-center">
                                        <div className="text-[10px] text-white/50 mb-1">{isF2 ? 'ร้อย-1' : `หน่วยบน (${prediction.s1D})`}</div>
                                        <div className="text-6xl font-black">{prediction.d1}</div>
                                    </div>
                                    <div className="text-2xl text-white/30 opacity-50">+</div>
                                    <div className="text-center">
                                        <div className="text-[10px] text-white/50 mb-1">{isF2 ? 'หน่วย-1' : `หน่วยล่าง (${prediction.s2D})`}</div>
                                        <div className="text-6xl font-black">{prediction.d2}</div>
                                    </div>
                                </div>
                                <div className="inline-block bg-white/10 backdrop-blur-sm px-6 py-2 rounded-full border border-white/20">
                                    คู่ดับ/ระวัง: <span className="font-bold text-yellow-300">{prediction.d1}{prediction.d2}</span>
                                </div>
                            </div>
                        </div>
                    )}
                    <div className="bg-white rounded-2xl shadow-sm overflow-hidden border border-slate-100">
                        <div className="p-4 bg-slate-50 border-b border-slate-100 flex gap-4 text-xs font-bold justify-center">
                            <span className="text-green-600 flex items-center gap-1"><Icon name="check" className="w-3 h-3"/> ผ่าน (เข้า 0-1)</span>
                            <span className="text-red-500 flex items-center gap-1"><Icon name="alert" className="w-3 h-3"/> หลุด (เข้า 2)</span>
                        </div>
                        <div className="overflow-x-auto">
                            <table className="w-full text-sm text-center">
                                <thead className="text-xs text-slate-500 bg-slate-50/50 uppercase border-b">
                                    <tr>
                                        <th className="px-3 py-4 font-semibold">{isF2 ? 'งวดเป้าหมาย' : 'งวดเป้าหมาย'}</th>
                                        <th className={`px-3 py-4 ${textVal}`}>ตัวที่ 1</th>
                                        <th className={`px-3 py-4 ${textVal}`}>ตัวที่ 2</th>
                                        <th className="px-3 py-4 text-slate-400">คู่จับ</th>
                                        <th className="px-3 py-4 font-bold text-slate-800">ผลจริง</th>
                                        <th className="px-3 py-4">สถานะ</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100">
                                    {results.map((r, i) => (
                                        <tr key={i} className={`hover:bg-slate-50 ${r.isDoubleHit ? 'bg-red-50' : ''}`}>
                                            <td className="px-3 py-4 text-slate-600">{isF2 ? r.nextDate : r.targetDate}</td>
                                            <td className={`px-3 py-4 font-bold ${textVal} text-lg`}>{r.d1}</td>
                                            <td className={`px-3 py-4 font-bold ${textVal} text-lg`}>{r.d2}</td>
                                            <td className="px-3 py-4 text-slate-400">{r.d1}{r.d2}</td>
                                            <td className="px-3 py-4 font-black text-slate-800 text-lg">{isF2 ? r.nextBottom : r.targetBottom}</td>
                                            <td className="px-3 py-4">
                                                {r.isDoubleHit 
                                                    ? <span className="inline-flex items-center gap-1 px-2 py-1 rounded-md bg-red-500 text-white text-xs font-bold shadow-sm">หลุด</span>
                                                    : <span className="inline-flex items-center gap-1 px-2 py-1 rounded-md bg-green-100 text-green-700 text-xs font-bold">ผ่าน</span>
                                                }
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        };

        const Formula3View = ({ stats, deadNumbers }) => (
            <div className="space-y-6">
                <div className="bg-white border-2 border-rose-100 rounded-3xl p-6 text-center shadow-lg relative overflow-hidden">
                    <div className="absolute top-0 right-0 w-24 h-24 bg-rose-50 rounded-full blur-xl -mr-6 -mt-6"></div>
                    <h3 className="text-slate-500 font-bold mb-4 font-display">เลขดับ (โอกาสมาน้อยที่สุด)</h3>
                    <div className="flex justify-center items-center gap-6">
                        {deadNumbers.map((d, i) => (
                            <div key={i} className="flex flex-col items-center">
                                <div className="text-8xl font-black text-rose-600 font-display drop-shadow-sm">{d.num}</div>
                                <div className="text-xs text-rose-400 mt-2 bg-rose-50 px-2 py-1 rounded">คะแนนความดับ: {d.finalScore.toFixed(1)}</div>
                            </div>
                        ))}
                    </div>
                    <p className="text-xs text-slate-400 mt-4">*คำนวณจาก Z-Score + Gap + Recency Bonus</p>
                </div>

                <div className="bg-white rounded-2xl shadow-sm overflow-hidden border border-slate-100">
                    <div className="p-4 border-b border-slate-100 bg-slate-50/50">
                        <h3 className="font-bold text-slate-700">ตารางวิเคราะห์สถิติเชิงลึก (เรียงตามโอกาสดับ)</h3>
                    </div>
                    <div className="overflow-x-auto">
                        <table className="w-full text-sm text-center">
                            <thead className="text-xs text-slate-500 bg-slate-50 uppercase border-b">
                                <tr>
                                    <th className="px-3 py-3">เลข</th>
                                    <th className="px-3 py-3">ออก (ครั้ง)</th>
                                    <th className="px-3 py-3">Gap (งวด)</th>
                                    <th className="px-3 py-3">Z-Score</th>
                                    <th className="px-3 py-3 text-rose-600 font-bold">คะแนนดับ</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100">
                                {stats.map((s, i) => (
                                    <tr key={i} className={`hover:bg-slate-50 ${i < 2 ? 'bg-rose-50/30' : ''}`}>
                                        <td className="px-3 py-3 font-bold text-lg">{s.num}</td>
                                        <td className="px-3 py-3 text-slate-600">{s.count}</td>
                                        <td className="px-3 py-3 text-slate-600">{s.gap}</td>
                                        <td className="px-3 py-3 text-slate-400">{s.zScore.toFixed(2)}</td>
                                        <td className={`px-3 py-3 font-bold ${i < 2 ? 'text-rose-600' : 'text-slate-700'}`}>{s.finalScore.toFixed(1)}</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
