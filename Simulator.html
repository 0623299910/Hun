<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ผลหุ้นต่างประเทศ - Realtime</title>
    <!-- เรียกใช้ Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- เรียกใช้ Font ภาษาไทย (Sarabun) -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #f3f4f6;
        }
        /* Custom Animation for loading */
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .animate-spin-custom {
            animation: spin 1s linear infinite;
        }
        /* Hide scrollbar for cleaner look */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="min-h-screen py-4 px-2">

    <div class="max-w-md mx-auto bg-white shadow-xl rounded-xl overflow-hidden border border-gray-200">
        
        <!-- Header ส่วนหัวสีแดง -->
        <div class="bg-[#8B2323] text-white p-4">
            <div class="flex justify-between items-center mb-2">
                <h1 class="text-xl font-bold">ผลหุ้นต่างประเทศ</h1>
                <div class="flex items-center gap-2">
                    <span id="update-time" class="text-xs opacity-80 flex items-center gap-1">
                        <!-- เวลาจะแสดงที่นี่ -->
                    </span>
                    <button onclick="fetchData()" id="refresh-btn" class="p-1.5 bg-white/10 rounded-full hover:bg-white/20 transition-all" title="รีเฟรชข้อมูล">
                        <!-- Refresh Icon (SVG) -->
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path>
                            <path d="M21 3v5h-5"></path>
                            <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path>
                            <path d="M3 21v-5h5"></path>
                        </svg>
                    </button>
                </div>
            </div>
            
            <!-- Column Headers -->
            <div class="flex text-sm font-semibold mt-2">
                <div class="w-[45%] pl-2">รายการหวย</div>
                <div class="w-[30%] text-center border-l border-white/20">3 ตัวบน</div>
                <div class="w-[25%] text-center border-l border-white/20">2 ตัวล่าง</div>
            </div>
        </div>

        <!-- Content Table Container -->
        <div id="stock-list" class="divide-y divide-gray-100 bg-white">
            <!-- ข้อมูลหุ้นจะถูกใส่ที่นี่ด้วย JavaScript -->
            <div class="p-8 text-center text-gray-400">กำลังโหลดข้อมูล...</div>
        </div>

        <!-- Footer Note -->
        <div class="bg-gray-50 p-3 text-[10px] text-gray-400 text-center border-t">
            <p class="flex items-center justify-center gap-1">
                <svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                ข้อมูลนี้เป็นการจำลองเพื่อแสดงผล UI เท่านั้น
            </p>
        </div>
    </div>

    <script>
        // ข้อมูลหุ้นตั้งต้น
        const STOCK_LIST = [
            { id: 1, name: 'หุ้นดาวโจนส์', flagCode: 'us', time: '03:20' },
            { id: 2, name: 'หุ้นนิเคอิเช้า', flagCode: 'jp', time: '09:30' },
            { id: 3, name: 'หุ้นจีนเช้า', flagCode: 'cn', time: '10:30' },
            { id: 4, name: 'หุ้นฮั่งเส็งเช้า', flagCode: 'hk', time: '11:00' },
            { id: 5, name: 'หุ้นไต้หวัน', flagCode: 'tw', time: '12:35' },
            { id: 6, name: 'หุ้นนิเคอิบบ่าย', flagCode: 'jp', time: '13:00' },
            { id: 7, name: 'หุ้นเกาหลี', flagCode: 'kr', time: '13:35' },
            { id: 8, name: 'หุ้นจีนบ่าย', flagCode: 'cn', time: '14:00' },
            { id: 9, name: 'หุ้นฮั่งเส็งบ่าย', flagCode: 'hk', time: '15:00' },
            { id: 10, name: 'หุ้นสิงคโปร์', flagCode: 'sg', time: '16:30' },
            { id: 11, name: 'หุ้นไทยเย็น', flagCode: 'th', time: '16:40' },
            { id: 12, name: 'หุ้นอินเดีย', flagCode: 'in', time: '17:30' },
            { id: 13, name: 'หุ้นอียิปต์', flagCode: 'eg', time: '20:00' },
            { id: 14, name: 'หุ้นอังกฤษ', flagCode: 'gb', time: '23:00' },
            { id: 15, name: 'หุ้นรัสเซีย', flagCode: 'ru', time: '23:00' },
            { id: 16, name: 'หุ้นเยอรมัน', flagCode: 'de', time: '23:00' },
        ];

        // ตัวแปรเก็บผลลัพธ์
        let currentResults = {};

        // ฟังก์ชันสร้าง HTML สำหรับแต่ละแถว
        function renderRow(stock, result) {
            const top3 = result ? result.top3 : '-';
            const bottom2 = result ? result.bottom2 : '-';
            
            // Effect โหลดข้อมูล (Skeleton loading)
            const loadingClass = !result ? 'animate-pulse bg-gray-200 text-transparent rounded' : '';

            return `
            <div class="flex items-center py-3 px-3 hover:bg-gray-50 transition-colors">
                <!-- รายการหวย (ซ้าย) -->
                <div class="w-[45%] flex items-center gap-3">
                    <div class="relative shrink-0 w-8 h-8">
                        <img 
                            src="https://flagcdn.com/w40/${stock.flagCode}.png"
                            srcset="https://flagcdn.com/w80/${stock.flagCode}.png 2x"
                            alt="${stock.name}"
                            class="w-8 h-8 rounded-full object-cover shadow-sm border border-gray-100 bg-gray-200"
                            onerror="this.style.display='none'"
                        />
                    </div>
                    
                    <div class="flex flex-col">
                        <span class="text-sm font-bold text-gray-700 leading-tight">${stock.name}</span>
                        <div class="flex items-center gap-1 mt-1">
                            <span class="bg-black text-white text-[10px] px-2 py-0.5 rounded-full font-mono flex items-center">
                                ${stock.time}
                            </span>
                        </div>
                    </div>
                </div>

                <!-- 3 ตัวบน (กลาง) -->
                <div class="w-[30%] text-center flex justify-center">
                    <span class="text-lg font-bold text-gray-800 tracking-wider ${!result ? 'w-12 h-6 block ' + loadingClass : ''}">
                        ${top3}
                    </span>
                </div>

                <!-- 2 ตัวล่าง (ขวา) -->
                <div class="w-[25%] text-center flex justify-center">
                    <span class="text-lg font-bold text-gray-800 tracking-wider ${!result ? 'w-8 h-6 block ' + loadingClass : ''}">
                        ${bottom2}
                    </span>
                </div>
            </div>
            `;
        }

        // เพิ่มแถวเปล่าๆ ด้านล่าง (Placeholder) เพื่อความสวยงามเหมือนต้นฉบับ
        function renderPlaceholders() {
            let html = '';
            for(let i=0; i<3; i++) {
                html += `
                <div class="flex items-center py-3 px-3 opacity-50">
                    <div class="w-[45%]"></div>
                    <div class="w-[30%] text-center flex justify-center">
                        <div class="w-4 h-4 rounded-full border-2 border-purple-200"></div>
                    </div>
                    <div class="w-[25%] text-center flex justify-center">
                        <div class="w-4 h-4 rounded-full border-2 border-purple-200"></div>
                    </div>
                </div>
                `;
            }
            return html;
        }

        // ฟังก์ชันหลักในการวาดหน้าจอ
        function renderApp(isLoading = false) {
            const container = document.getElementById('stock-list');
            
            // สร้าง HTML ของรายการหุ้นทั้งหมด
            const listHtml = STOCK_LIST.map(stock => {
                // ถ้ากำลังโหลด ให้ส่ง null ไปเพื่อแสดง Skeleton loader
                // ถ้าโหลดเสร็จ ให้ส่งค่าผลลัพธ์จาก currentResults
                const result = isLoading ? null : currentResults[stock.id];
                return renderRow(stock, result);
            }).join('');

            container.innerHTML = listHtml + renderPlaceholders();
        }

        // ฟังก์ชันจำลองการดึงข้อมูล
        function fetchData() {
            const refreshBtn = document.getElementById('refresh-btn');
            const timeDisplay = document.getElementById('update-time');
            
            // เริ่มสถานะ Loading
            refreshBtn.classList.add('animate-spin-custom');
            timeDisplay.innerText = 'กำลังอัปเดต...';
            
            // เคลียร์ค่าเพื่อแสดง Skeleton Loading ก่อน
            renderApp(true); 

            // จำลอง Delay 1 วินาที
            setTimeout(() => {
                // สุ่มตัวเลขใหม่
                STOCK_LIST.forEach(stock => {
                    currentResults[stock.id] = {
                        top3: Math.floor(Math.random() * 1000).toString().padStart(3, '0'),
                        bottom2: Math.floor(Math.random() * 100).toString().padStart(2, '0')
                    };
                });

                // อัปเดตเวลา
                const now = new Date();
                const timeString = now.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
                timeDisplay.innerText = `อัปเดต: ${timeString}`;

                // หยุดหมุนปุ่ม และวาดหน้าจอใหม่
                refreshBtn.classList.remove('animate-spin-custom');
                renderApp(false);

            }, 800);
        }

        // เริ่มทำงานเมื่อเปิดหน้าเว็บ
        window.onload = () => {
            fetchData();
            // ตั้งเวลา Auto Refresh ทุก 60 วินาที
            setInterval(fetchData, 60000);
        };

    </script>
</body>
</html>
