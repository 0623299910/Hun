<!doctype html>
<html lang="th" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เครื่องคิดสูตรหวย (7 ตัวเลข) - พร้อมบทวิเคราะห์</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    body {
      box-sizing: border-box;
    }
    
    * {
      font-family: 'Kanit', sans-serif;
    }
    
    .formula-card {
      transition: transform 0.2s;
    }
    
    .formula-card:hover {
      transform: translateY(-2px);
    }

    .tab-button {
      transition: all 0.3s ease;
    }

    .tab-button:hover {
      opacity: 0.9;
    }
    
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    
    .bar-animate {
        animation: growBar 1s ease-out forwards;
    }
    
    @keyframes growBar {
        from { width: 0; }
    }
  </style>
 </head>
 <body class="h-full bg-slate-50 text-slate-800">
  <div id="app" class="w-full h-full overflow-auto"></div>
  <script>
    // Configuration
    const defaultConfig = {
      background_color: '#f0f4f8',
      card_color: '#ffffff',
      text_color: '#1e293b',
      primary_action: '#3b82f6',
      secondary_action: '#64748b',
      danger_action: '#ef4444',
      success_color: '#10b981',
      font_family: 'Kanit',
      font_size: 16,
      app_title: 'เครื่องคิดสูตรหวย (7 ตัวเลข)',
    };

    let config = { ...defaultConfig };
    let historyData = [];
    // Start at 'input' tab by default because data is cleared on load
    let currentTab = 'input';

    // Helper: Parse Thai Date String (dd/mm/yy or dd/mm/yyyy) to Comparable Number
    function getNumericDate(dateStr) {
        if (!dateStr) return 0;
        try {
            const parts = dateStr.trim().split('/');
            if (parts.length !== 3) return 0;
            
            let [d, m, y] = parts.map(Number);
            if (y < 100) y += 2500;
            return (y * 10000) + (m * 100) + d;
        } catch (e) {
            return 0;
        }
    }

    // Sort Data Function (Newest Date First)
    function sortDataByDate(data) {
        return [...data].sort((a, b) => {
            const dateA = getNumericDate(a.round_number);
            const dateB = getNumericDate(b.round_number);
            if (dateA !== dateB) return dateB - dateA; 
            return new Date(b.created_at) - new Date(a.created_at);
        });
    }

    // Initialization: Clear Data on Load
    function initData() {
      // Explicitly clear storage on startup
      localStorage.removeItem('lottery_history_v2');
      historyData = [];
    }

    // Save Data (For current session usage)
    function saveData() {
      localStorage.setItem('lottery_history_v2', JSON.stringify(historyData));
    }

    // Core Calculation Logic
    function calculateFormulas(threeDigit) {
      const digits = threeDigit.split('').map(Number);
      const [hundred, ten, unit] = digits;
      
      const formulas = [];
      const loopCount = 7;
      
      const generateSeq = (startVal) => {
        const arr = [];
        for (let i = 0; i < loopCount; i++) {
          arr.push((startVal + i) % 10);
        }
        return arr;
      };

      formulas.push({ name: 'สูตร 1', description: 'ร้อย+5 เดินหน้า', numbers: generateSeq(hundred + 5) });
      formulas.push({ name: 'สูตร 2', description: 'สิบ+3 เดินหน้า', numbers: generateSeq(ten + 3) });
      formulas.push({ name: 'สูตร 3', description: 'หน่วย+7 เดินหน้า', numbers: generateSeq(unit + 7) });
      formulas.push({ name: 'สูตร 4', description: 'ร้อย+สิบ เดินหน้า', numbers: generateSeq(hundred + ten) });
      formulas.push({ name: 'สูตร 5', description: 'สิบ+หน่วย เดินหน้า', numbers: generateSeq(ten + unit) });
      formulas.push({ name: 'สูตร 6', description: 'ร้อย+สิบ+หน่วย เดินหน้า', numbers: generateSeq(hundred + ten + unit) });
      formulas.push({ name: 'สูตร 7', description: 'ร้อย-สิบ เดินหน้า', numbers: generateSeq(hundred - ten + 10) });
      formulas.push({ name: 'สูตร 8', description: 'สิบ-หน่วย เดินหน้า', numbers: generateSeq(ten - unit + 10) });
      formulas.push({ name: 'สูตร 9', description: 'ร้อย×2 เดินหน้า', numbers: generateSeq(hundred * 2) });
      formulas.push({ name: 'สูตร 10', description: 'สิบ×2 เดินหน้า', numbers: generateSeq(ten * 2) });
      formulas.push({ name: 'สูตร 11', description: 'หน่วย×2 เดินหน้า', numbers: generateSeq(unit * 2) });
      formulas.push({ name: 'สูตร 12', description: 'ร้อย+3 เดินหน้า', numbers: generateSeq(hundred + 3) });
      formulas.push({ name: 'สูตร 13', description: 'สิบ+7 เดินหน้า', numbers: generateSeq(ten + 7) });
      formulas.push({ name: 'สูตร 14', description: 'หน่วย+5 เดินหน้า', numbers: generateSeq(unit + 5) });
      formulas.push({ name: 'สูตร 15', description: 'ร้อย-หน่วย เดินหน้า', numbers: generateSeq(hundred - unit + 10) });
      
      return formulas;
    }

    function checkMatch(formulaNumbers, twoDigit) {
      if (!twoDigit || twoDigit.length !== 2) return { matched: false, count: 0, positions: [] };
      const digits = twoDigit.split('').map(Number);
      const matches = [];
      if (formulaNumbers.includes(digits[0])) matches.push(0);
      if (formulaNumbers.includes(digits[1])) matches.push(1);
      return { matched: matches.length > 0, count: matches.length };
    }

    function calculateStatistics() {
      const sortedData = sortDataByDate(historyData);
      const last20 = sortedData.slice(0, 20);
      
      const formulaStats = {};
      for (let i = 1; i <= 15; i++) {
        formulaStats[`สูตร ${i}`] = { hits: 0, twoDigitHits: 0, oneDigitHits: 0 };
      }
      
      let totalComparisons = 0;
      
      for (let i = last20.length - 1; i > 0; i--) {
        const olderRecord = last20[i];     
        const newerRecord = last20[i - 1]; 
        
        if (olderRecord.three_digits && newerRecord.two_digits) {
          totalComparisons++;
          const formulas = calculateFormulas(olderRecord.three_digits);
          
          formulas.forEach(formula => {
            const match = checkMatch(formula.numbers, newerRecord.two_digits);
            if (match.matched) {
              formulaStats[formula.name].hits++;
              if (match.count === 2) {
                formulaStats[formula.name].twoDigitHits++;
              } else if (match.count === 1) {
                formulaStats[formula.name].oneDigitHits++;
              }
            }
          });
        }
      }
      
      const statsArray = Object.entries(formulaStats).map(([name, stats]) => ({
        name,
        hits: stats.hits,
        twoDigitHits: stats.twoDigitHits,
        oneDigitHits: stats.oneDigitHits,
        percentage: totalComparisons > 0 ? (stats.hits / totalComparisons * 100).toFixed(1) : 0
      }));
      
      statsArray.sort((a, b) => {
        if (b.hits !== a.hits) return b.hits - a.hits;
        if (b.twoDigitHits !== a.twoDigitHits) return b.twoDigitHits - a.twoDigitHits;
        return b.oneDigitHits - a.oneDigitHits;
      });
      
      return { statsArray, totalComparisons, recordCount: historyData.length };
    }

    // Handlers
    function handleBulkSubmit(e) {
      e.preventDefault();
      
      const formData = new FormData(e.target);
      const bulkData = formData.get('bulk_data').trim();
      
      if (!bulkData) {
        showMessage('กรุณาวางข้อมูล', 'error');
        return;
      }
      
      const lines = bulkData.split('\n').filter(line => line.trim());
      const validRecords = [];
      const errors = [];
      
      lines.forEach((line, index) => {
        const parts = line.trim().split(/[\t\s]+/);
        let date, threeDigit, twoDigit;

        if (parts.length >= 3) {
            date = parts[0];
            threeDigit = parts[1].replace(/'/g, '');
            twoDigit = parts[2].replace(/'/g, '');
        } else if (parts.length === 2) {
            date = parts[0];
            threeDigit = parts[1].replace(/'/g, '');
            twoDigit = "";
        } else {
             errors.push(`บรรทัด ${index + 1}: รูปแบบไม่ถูกต้อง`);
             return;
        }
        
        if (!/^\d{3}$/.test(threeDigit)) {
          errors.push(`บรรทัด ${index + 1}: สามตัวบนไม่ถูกต้อง`);
          return;
        }
        
        if (twoDigit && !/^\d{2}$/.test(twoDigit)) {
          errors.push(`บรรทัด ${index + 1}: สองตัวล่างไม่ถูกต้อง`);
          return;
        }
        
        validRecords.push({
          round_number: date,
          three_digits: threeDigit,
          two_digits: twoDigit
        });
      });
      
      if (errors.length > 0) {
        showMessage(`พบข้อผิดพลาด: ${errors.slice(0,3).join(', ')}...`, 'error');
        return;
      }
      
      if (validRecords.length === 0) {
        showMessage('ไม่พบข้อมูลที่ถูกต้อง', 'error');
        return;
      }
      
      const submitBtn = document.getElementById('btn-import');
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="animate-pulse">กำลังนำเข้า...</span>';
      
      let count = 0;
      validRecords.forEach(rec => {
        historyData.push({
            id: `rec_${Date.now()}_${count++}`,
            round_number: rec.round_number,
            three_digits: rec.three_digits,
            two_digits: rec.two_digits,
            created_at: new Date().toISOString()
        });
      });

      saveData();
      
      setTimeout(() => {
          submitBtn.disabled = false;
          submitBtn.textContent = 'นำเข้าข้อมูล';
          e.target.reset();
          showMessage(`นำเข้าสำเร็จ ${validRecords.length} รายการ`, 'success');
          // Switch to Analysis tab directly after import for convenience
          currentTab = 'analysis';
          renderApp();
      }, 500);
    }

    function handleClearData() {
        if(confirm('คุณแน่ใจหรือไม่ที่จะลบข้อมูลทั้งหมด?')) {
            historyData = [];
            saveData();
            showMessage('ล้างข้อมูลเรียบร้อยแล้ว', 'success');
            // Force reset to input tab
            currentTab = 'input';
            renderApp();
        }
    }

    function handleDeleteRecord(id) {
        if(confirm('ต้องการลบรายการนี้?')) {
            historyData = historyData.filter(r => r.id !== id);
            saveData();
            renderApp();
        }
    }

    function showMessage(text, type) {
      const container = document.getElementById('message-container');
      const messageDiv = document.createElement('div');
      const bgColor = type === 'success' ? config.success_color : config.danger_action;
      
      messageDiv.className = 'px-6 py-3 rounded-lg mb-2 shadow-lg text-white font-medium flex items-center gap-2 transform translate-y-2 opacity-0 transition-all duration-300';
      messageDiv.style.backgroundColor = bgColor;
      messageDiv.innerHTML = `<span>${type === 'success' ? '✓' : '⚠'}</span><span>${text}</span>`;
      
      container.appendChild(messageDiv);
      requestAnimationFrame(() => messageDiv.classList.remove('translate-y-2', 'opacity-0'));
      setTimeout(() => {
        messageDiv.classList.add('opacity-0', 'translate-y-[-10px]');
        setTimeout(() => messageDiv.remove(), 300);
      }, 3000);
    }

    // UI Rendering
    function renderApp() {
      const app = document.getElementById('app');
      
      app.innerHTML = `
        <div class="min-h-full bg-slate-50 pb-10">
            <div class="bg-white shadow-sm border-b sticky top-0 z-10">
                <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row items-center justify-between gap-4">
                    <div class="flex items-center gap-3">
                        <div class="bg-blue-600 text-white p-2 rounded-lg">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z" />
                            </svg>
                        </div>
                        <h1 class="text-2xl font-bold text-slate-800 tracking-tight">${config.app_title}</h1>
                    </div>
                    
                    <div class="flex items-center gap-2 bg-slate-100 px-4 py-2 rounded-full text-sm font-medium text-slate-600">
                        <span>จำนวนข้อมูล:</span>
                        <span class="text-blue-600 font-bold text-lg">${historyData.length}</span>
                        <span>งวด</span>
                    </div>
                </div>
                
                <div class="max-w-7xl mx-auto px-4 mt-2">
                    <div class="flex overflow-x-auto gap-2 pb-2 md:pb-0 no-scrollbar">
                        ${renderNavButton('input', '📥 นำเข้าข้อมูล')}
                        ${renderNavButton('analysis', '🔍 สรุปเลขแรก')}
                        ${renderNavButton('compare', '🎯 เทียบสูตร')}
                        ${renderNavButton('history', '📜 ประวัติ')}
                        ${renderNavButton('stats', '📊 สถิติ')}
                    </div>
                </div>
            </div>

            <div class="max-w-7xl mx-auto p-4 md:p-6" id="content-container">
                <div id="message-container" class="fixed top-20 right-4 z-50 flex flex-col items-end pointer-events-none"></div>
                ${renderContent()}
            </div>
        </div>
      `;

      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          currentTab = e.currentTarget.dataset.tab;
          renderApp();
        });
      });
      
      const bulkForm = document.getElementById('bulk-form');
      if (bulkForm) bulkForm.addEventListener('submit', handleBulkSubmit);
      
      // ฟังก์ชันดักจับการ "วาง" (Paste) ข้อมูลเพื่อนำเข้าอัตโนมัติ
      const bulkDataTextarea = document.getElementById('bulk_data');
      if (bulkDataTextarea) {
          bulkDataTextarea.addEventListener('paste', () => {
              setTimeout(() => {
                  const submitBtn = document.getElementById('btn-import');
                  // ตรวจสอบว่ามีปุ่มและมีข้อมูลในกล่องข้อความ
                  if (submitBtn && bulkDataTextarea.value.trim() !== '') {
                      submitBtn.click(); // จำลองการคลิกปุ่ม
                  }
              }, 50);
          });
      }

      const clearBtn = document.getElementById('btn-clear');
      if (clearBtn) clearBtn.addEventListener('click', handleClearData);

      document.querySelectorAll('.btn-delete-record').forEach(btn => {
          btn.addEventListener('click', (e) => handleDeleteRecord(e.currentTarget.dataset.id));
      });
    }

    function renderNavButton(tabName, label) {
        const isActive = currentTab === tabName;
        const activeClass = "border-blue-500 text-blue-600 bg-blue-50";
        const inactiveClass = "border-transparent text-slate-500 hover:text-slate-700 hover:bg-slate-50";
        return `
            <button data-tab="${tabName}" class="nav-btn whitespace-nowrap px-6 py-3 border-b-2 font-medium text-sm transition-colors rounded-t-lg ${isActive ? activeClass : inactiveClass}">${label}</button>
        `;
    }

    function renderContent() {
      switch(currentTab) {
        case 'input': return renderInputSection();
        case 'compare': return renderCompareSection();
        case 'analysis': return renderAnalysisSection();
        case 'history': return renderHistorySection();
        case 'stats': return renderStatsSection();
        default: return renderInputSection();
      }
    }

    function renderAnalysisSection() {
        if (historyData.length === 0) return renderEmptyState('ยังไม่มีข้อมูล', 'กรุณานำเข้าข้อมูลก่อนเพื่อทำการวิเคราะห์');
        
        const sortedData = sortDataByDate(historyData);
        const latest = sortedData[0];
        const nextFormulas = calculateFormulas(latest.three_digits);
        
        // Extract first digits
        const firstDigits = nextFormulas.map(f => f.numbers[0]);
        
        // Count frequencies
        const counts = {};
        for (let i = 0; i <= 9; i++) counts[i] = 0;
        firstDigits.forEach(num => counts[num]++);
        
        // Find max and min (min only from numbers that appeared)
        let maxVal = -1;
        let minVal = 16;
        
        Object.entries(counts).forEach(([num, count]) => {
            if (count > maxVal) maxVal = count;
            if (count > 0 && count < minVal) minVal = count;
        });
        
        const mostFrequent = Object.entries(counts).filter(([n, c]) => c === maxVal).map(([n]) => n);
        const leastFrequent = Object.entries(counts).filter(([n, c]) => c === minVal).map(([n]) => n);
        
        // Sort for table: count desc, then number asc
        const sortedCounts = Object.entries(counts).sort((a, b) => b[1] - a[1] || a[0] - b[0]);

        return `
            <div class="space-y-6">
                <div class="bg-gradient-to-r from-blue-600 to-indigo-700 rounded-xl shadow-lg p-6 text-white">
                    <div class="flex justify-between items-start">
                        <div>
                            <h2 class="text-2xl font-bold flex items-center gap-2">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-yellow-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                                </svg>
                                สรุปเจาะเลขตัวแรก
                            </h2>
                            <p class="text-blue-100 mt-1">วิเคราะห์จากเลขตัวแรกของทั้ง 15 สูตร (งวดวันที่ ${latest.round_number})</p>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="bg-white rounded-xl shadow-sm border border-green-200 p-6 relative overflow-hidden">
                        <div class="absolute top-0 right-0 p-4 opacity-10">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-32 w-32 text-green-600" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M12 7a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0V8.414l-4.293 4.293a1 1 0 01-1.414 0L8 10.414l-4.293 4.293a1 1 0 01-1.414-1.414l5-5a1 1 0 011.414 0L11 10.586 15.293 6.293A1 1 0 0115 7h-3z" clip-rule="evenodd" /></svg>
                        </div>
                        <h3 class="text-lg font-bold text-green-700 flex items-center gap-2">
                            <span class="w-2 h-6 bg-green-500 rounded-full"></span>
                            ชนเยอะที่สุด (มาแรง)
                        </h3>
                        <div class="mt-4 flex flex-wrap gap-3">
                            ${mostFrequent.map(n => `
                                <div class="flex flex-col items-center">
                                    <span class="w-16 h-16 flex items-center justify-center bg-green-500 text-white text-3xl font-bold rounded-2xl shadow-lg shadow-green-200">${n}</span>
                                    <span class="text-xs font-bold text-green-600 mt-2 bg-green-100 px-2 py-0.5 rounded-full">ซ้ำ ${maxVal} สูตร</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 relative overflow-hidden">
                        <div class="absolute top-0 right-0 p-4 opacity-10">
                             <svg xmlns="http://www.w3.org/2000/svg" class="h-32 w-32 text-slate-600" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M14.707 12.293a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 111.414-1.414L9 14.586V3a1 1 0 012 0v11.586l2.293-2.293a1 1 0 011.414 0z" clip-rule="evenodd" /></svg>
                        </div>
                        <h3 class="text-lg font-bold text-slate-700 flex items-center gap-2">
                            <span class="w-2 h-6 bg-slate-400 rounded-full"></span>
                            ชนน้อยที่สุด (รอง)
                        </h3>
                        <div class="mt-4 flex flex-wrap gap-3">
                            ${leastFrequent.length > 0 ? leastFrequent.map(n => `
                                <div class="flex flex-col items-center">
                                    <span class="w-14 h-14 flex items-center justify-center bg-white border-2 border-slate-200 text-slate-600 text-2xl font-bold rounded-2xl">${n}</span>
                                    <span class="text-xs font-bold text-slate-500 mt-2 bg-slate-100 px-2 py-0.5 rounded-full">ซ้ำ ${minVal} สูตร</span>
                                </div>
                            `).join('') : '<span class="text-slate-400 italic">ไม่มีข้อมูลเลขชนน้อย</span>'}
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div class="lg:col-span-1 bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                        <h3 class="font-bold text-slate-800 mb-4 border-b pb-2">ความถี่ของเลข 0-9</h3>
                        <div class="space-y-3">
                            ${sortedCounts.map(([num, count]) => {
                                const percent = (count / 15) * 100;
                                const isMax = count === maxVal;
                                return `
                                    <div class="flex items-center gap-3">
                                        <div class="w-6 font-bold text-slate-600 text-center">${num}</div>
                                        <div class="flex-1 bg-slate-100 rounded-full h-3 overflow-hidden">
                                            <div class="h-full rounded-full ${isMax ? 'bg-green-500' : 'bg-slate-400'} bar-animate" style="width: ${percent}%"></div>
                                        </div>
                                        <div class="w-6 text-xs text-slate-400 text-right">${count}</div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>

                    <div class="lg:col-span-2 bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                        <div class="p-4 bg-slate-50 border-b border-slate-200 font-bold text-slate-700">
                            ตารางเจาะเลขตัวแรกรายสูตร
                        </div>
                        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-px bg-slate-200">
                            ${nextFormulas.map((f, i) => {
                                const num = f.numbers[0];
                                const isHighlight = mostFrequent.includes(num.toString());
                                return `
                                    <div class="bg-white p-3 flex flex-col items-center justify-center gap-1 hover:bg-slate-50 transition-colors">
                                        <span class="text-[10px] text-slate-400 uppercase tracking-wide">สูตรที่ ${i+1}</span>
                                        <span class="text-2xl font-bold ${isHighlight ? 'text-green-600 scale-110' : 'text-slate-700'} transition-transform">${num}</span>
                                        <span class="text-[9px] text-slate-300 truncate w-full text-center">${f.description}</span>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                </div>
            </div>
        `;
    }

    function renderInputSection() {
        return `
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                    <div>
                        <h2 class="text-xl font-bold text-slate-800">นำเข้าข้อมูลหวย</h2>
                        <p class="text-slate-500 text-sm mt-1">วางข้อมูลเพื่อคำนวณอัตโนมัติ</p>
                    </div>
                    ${historyData.length > 0 ? `
                        <button id="btn-clear" class="flex items-center gap-2 px-4 py-2 bg-red-50 text-red-600 rounded-lg hover:bg-red-100 transition-colors text-sm font-medium border border-red-200">
                            ล้างข้อมูลทั้งหมด
                        </button>
                    ` : ''}
                </div>
                <div class="p-6">
                    <form id="bulk-form" class="space-y-4">
                        <textarea id="bulk_data" name="bulk_data" rows="12" required class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent font-mono text-base shadow-inner bg-slate-50" placeholder="รูปแบบ: วันที่    '3ตัวบน    '2ตัวล่าง&#10;ตัวอย่าง:&#10;16/01/25    '373    '48&#10;01/01/25    '422    '51"></textarea>
                        <button type="submit" id="btn-import" class="w-full md:w-auto px-8 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-semibold shadow-md shadow-blue-200 transition-all flex items-center justify-center gap-2">
                            นำเข้าข้อมูล
                        </button>
                    </form>
                </div>
            </div>
        `;
    }

    function renderHistorySection() {
        if (historyData.length === 0) return renderEmptyState('ยังไม่มีข้อมูลประวัติ', 'กรุณาไปที่แท็บ "นำเข้าข้อมูล" เพื่อวางข้อมูลใหม่');
        const sortedData = sortDataByDate(historyData);
        return `
            <div class="grid gap-6">
                ${sortedData.map(record => {
                    const formulas = calculateFormulas(record.three_digits);
                    return `
                        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden formula-card">
                            <div class="bg-slate-50 px-6 py-4 border-b border-slate-100 flex justify-between items-center">
                                <div class="flex items-center gap-4">
                                    <span class="bg-slate-800 text-white px-3 py-1 rounded-md text-sm font-bold shadow-sm">${record.round_number}</span>
                                    <div class="flex items-baseline gap-3">
                                        <span class="text-slate-500 text-sm">บน:</span>
                                        <span class="text-2xl font-bold text-blue-600 tracking-wider">${record.three_digits}</span>
                                        ${record.two_digits ? `<span class="text-slate-300 mx-2">|</span><span class="text-slate-500 text-sm">ล่าง:</span><span class="text-xl font-bold text-slate-700 tracking-wider">${record.two_digits}</span>` : ''}
                                    </div>
                                </div>
                                <button data-id="${record.id}" class="btn-delete-record text-slate-400 hover:text-red-500 transition-colors p-2 hover:bg-red-50 rounded-full" title="ลบรายการ">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                                </button>
                            </div>
                            <div class="p-6">
                                <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 xl:grid-cols-5 gap-4">
                                    ${formulas.map(f => `<div class="bg-slate-50 rounded-lg p-3 border border-slate-100"><div class="text-xs font-semibold text-slate-400 mb-1 flex justify-between"><span>${f.name}</span></div><div class="flex flex-wrap gap-1 justify-center">${f.numbers.map(n => `<span class="w-6 h-6 flex items-center justify-center bg-white border border-slate-200 rounded text-slate-700 font-bold text-sm shadow-sm">${n}</span>`).join('')}</div></div>`).join('')}
                                </div>
                            </div>
                        </div>
                    `;
                }).join('')}
            </div>
        `;
    }

    function renderCompareSection() {
        if (historyData.length < 2) return renderEmptyState('ข้อมูลไม่เพียงพอ', 'ต้องมีข้อมูลอย่างน้อย 2 งวดเพื่อทำการเทียบสูตรย้อนหลัง');
        
        const { statsArray } = calculateStatistics();
        const sortedData = sortDataByDate(historyData);
        const latest = sortedData[0];
        const nextFormulas = calculateFormulas(latest.three_digits);
        
        const predictionTable = `
             <div class="bg-white rounded-xl shadow-lg border border-slate-200 overflow-hidden mb-8">
                <div class="bg-indigo-700 p-6 text-white flex justify-between items-center flex-wrap gap-4">
                    <div>
                        <h2 class="text-2xl font-bold flex items-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-yellow-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                            </svg>
                            แนวทางงวดถัดไป
                        </h2>
                        <div class="flex items-center gap-2 mt-1">
                            <span class="text-indigo-200">คำนวณจากงวดวันที่:</span>
                            <span class="bg-indigo-900/50 px-2 py-0.5 rounded font-bold text-white border border-indigo-400/30">${latest.round_number}</span>
                            <span class="text-indigo-200">(เลขออก ${latest.three_digits})</span>
                        </div>
                    </div>
                    <div class="bg-indigo-800/50 px-4 py-2 rounded-lg border border-indigo-500/50 text-sm">
                        เรียงตามลำดับความแม่นยำสูงสุด
                    </div>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead class="bg-indigo-50 border-b border-indigo-100">
                            <tr>
                                <th class="px-6 py-4 font-bold text-indigo-900 w-24 text-center">อันดับ</th>
                                <th class="px-6 py-4 font-bold text-indigo-900 w-48">สูตรคำนวณ</th>
                                <th class="px-6 py-4 font-bold text-indigo-900">เลขเด็ด (7 ตัว)</th>
                                <th class="px-6 py-4 font-bold text-indigo-900 text-right w-32">ความแม่นยำ</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-100">
                            ${statsArray.map((stat, idx) => {
                                const f = nextFormulas.find(x => x.name === stat.name);
                                const isTop3 = idx < 3;
                                const rowClass = isTop3 ? 'bg-yellow-50/50' : 'hover:bg-slate-50';
                                return `
                                    <tr class="${rowClass} transition-colors">
                                        <td class="px-6 py-4 text-center">
                                            ${idx < 3 ? `<span class="inline-flex items-center justify-center w-8 h-8 rounded-full ${idx===0?'bg-yellow-100 text-yellow-700':idx===1?'bg-slate-200 text-slate-600':'bg-orange-100 text-orange-700'} font-bold">${idx+1}</span>` : `<span class="text-slate-400 font-medium">#${idx+1}</span>`}
                                        </td>
                                        <td class="px-6 py-4">
                                            <div class="font-bold text-slate-800 ${isTop3 ? 'text-lg' : ''}">${f.name}</div>
                                            <div class="text-xs text-slate-500">${f.description}</div>
                                        </td>
                                        <td class="px-6 py-4">
                                            <div class="flex flex-wrap gap-2">
                                                ${f.numbers.map(n => `<span class="w-10 h-10 flex items-center justify-center rounded-lg ${isTop3 ? 'bg-indigo-600 text-white shadow-md shadow-indigo-200' : 'bg-white border-2 border-slate-200 text-slate-600'} font-bold text-lg">${n}</span>`).join('')}
                                            </div>
                                        </td>
                                        <td class="px-6 py-4 text-right">
                                            <div class="font-bold ${isTop3 ? 'text-indigo-600 text-lg' : 'text-slate-600'}">${stat.percentage}%</div>
                                            <div class="text-xs text-slate-400">เข้า ${stat.hits} งวด</div>
                                        </td>
                                    </tr>
                                `;
                            }).join('')}
                        </tbody>
                    </table>
                </div>
            </div>
        `;

        let comparisonRows = '';
        const limit = Math.min(20, sortedData.length);
        
        for (let i = 0; i < limit - 1; i++) {
             const current = sortedData[i]; 
             const prev = sortedData[i+1];
             if(!prev.three_digits || !current.two_digits) continue;
             const calculated = calculateFormulas(prev.three_digits);
             
             comparisonRows += `
                <div class="bg-white rounded-lg shadow-sm border border-slate-200 mb-4 overflow-hidden">
                    <div class="flex flex-col md:flex-row md:items-stretch">
                        <div class="bg-slate-50 p-4 md:w-32 flex-shrink-0 border-b md:border-b-0 md:border-r border-slate-200 flex flex-row md:flex-col justify-between md:justify-center items-center gap-2">
                             <div class="text-center">
                                <div class="text-xs text-slate-400">งวดที่ออก</div>
                                <div class="font-bold text-slate-800 text-sm whitespace-nowrap">${current.round_number}</div>
                             </div>
                             <div class="flex items-center gap-2 md:flex-col md:gap-0">
                                <span class="bg-slate-200 px-2 py-0.5 rounded text-[10px] text-slate-500 mb-1">ล่าง</span>
                                <span class="text-2xl font-bold text-blue-600">${current.two_digits}</span>
                             </div>
                        </div>
                        <div class="p-4 flex-grow grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-5 gap-3">
                            ${statsArray.map((stat, idx) => {
                                const f = calculated.find(x => x.name === stat.name);
                                const match = checkMatch(f.numbers, current.two_digits);
                                const isHit = match.matched;
                                const hitClass = isHit ? (match.count === 2 ? 'bg-green-50 border-green-200' : 'bg-yellow-50 border-yellow-200') : 'bg-white border-slate-100 opacity-60 grayscale-[0.5]';
                                const rankBadge = idx < 3 ? `<span class="absolute -top-2 -right-2 w-5 h-5 flex items-center justify-center rounded-full text-xs border bg-white ${idx===0?'border-yellow-400 text-yellow-600':idx===1?'border-slate-300 text-slate-500':'border-orange-300 text-orange-600'}">${idx===0?'🥇':idx===1?'🥈':'🥉'}</span>` : '';
                                return `
                                    <div class="relative flex flex-col gap-1 p-2 rounded border ${hitClass}">
                                        ${rankBadge}
                                        <div class="flex justify-between items-center mb-1"><span class="text-xs font-bold text-slate-500">${f.name}</span>${isHit ? `<span class="text-[10px] font-bold ${match.count === 2 ? 'text-green-600' : 'text-yellow-600'}">เข้า ${match.count}</span>` : ''}</div>
                                        <div class="flex gap-0.5 justify-center">${f.numbers.map(n => {
                                                const isMatchDigit = current.two_digits.includes(n.toString());
                                                const digitClass = isMatchDigit ? (match.count === 2 ? 'bg-green-500 text-white border-green-600' : 'bg-yellow-400 text-white border-yellow-500') : 'bg-slate-50 text-slate-400 border-slate-200';
                                                return `<span class="w-5 h-5 flex items-center justify-center rounded text-xs font-bold border ${digitClass}">${n}</span>`;
                                            }).join('')}
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                </div>
             `;
        }

        return `<div class="space-y-6">${predictionTable}<div><h3 class="font-bold text-slate-700 text-lg mb-4 flex items-center gap-2"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>ผลการเดินสูตรย้อนหลัง</h3>${comparisonRows}</div></div>`;
    }
    
    function renderStatsSection() {
        if (historyData.length < 2) return renderEmptyState('กำลังรอข้อมูลเพิ่มเติม', 'ต้องการข้อมูลอย่างน้อย 2 งวดเพื่อคำนวณสถิติความแม่นยำ');
        const { statsArray, totalComparisons } = calculateStatistics();
        return `
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="p-6 border-b border-slate-100">
                    <h2 class="text-xl font-bold text-slate-800">สถิติความแม่นยำของสูตร</h2>
                    <p class="text-slate-500 text-sm">วิเคราะห์จาก ${totalComparisons} งวดล่าสุด</p>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-px bg-slate-100">
                    ${statsArray.map((stat, index) => {
                        const rank = index + 1;
                        const isTop = rank <= 3;
                        const barColor = isTop ? 'bg-blue-500' : 'bg-slate-300';
                        const textColor = isTop ? 'text-blue-700' : 'text-slate-600';
                        const bgColor = isTop ? 'bg-blue-50' : 'bg-white';
                        return `
                            <div class="p-4 hover:bg-slate-50 transition-colors ${bgColor}">
                                <div class="flex items-center justify-between mb-2">
                                    <div class="flex items-center gap-3">
                                        <span class="w-8 h-8 flex items-center justify-center rounded-full ${isTop ? 'bg-blue-100 text-blue-600 font-bold' : 'bg-slate-100 text-slate-500 text-sm'}">${rank}</span>
                                        <div><span class="font-bold ${textColor}">${stat.name}</span><span class="text-xs text-slate-400 ml-2">ถูก ${stat.hits} ครั้ง</span></div>
                                    </div>
                                    <div class="text-right"><span class="text-lg font-bold ${textColor}">${stat.percentage}%</span></div>
                                </div>
                                <div class="w-full bg-slate-100 rounded-full h-2 mb-2 overflow-hidden"><div class="${barColor} h-2 rounded-full" style="width: ${stat.percentage}%"></div></div>
                                <div class="flex justify-end gap-4 text-xs text-slate-500"><span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-green-400"></span> เข้า 2 ตัว: ${stat.twoDigitHits}</span><span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-yellow-400"></span> เข้า 1 ตัว: ${stat.oneDigitHits}</span></div>
                            </div>
                        `;
                    }).join('')}
                </div>
            </div>
        `;
    }
    
    function renderEmptyState(title, message) {
        return `<div class="flex flex-col items-center justify-center py-16 text-center bg-white rounded-xl border border-dashed border-slate-300"><div class="bg-slate-50 p-4 rounded-full mb-4"><svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-slate-300" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg></div><h3 class="text-lg font-medium text-slate-900">${title}</h3><p class="text-slate-500 max-w-sm mt-1 mb-6">${message}</p>${currentTab !== 'input' ? `<button onclick="currentTab='input'; renderApp();" class="text-blue-600 font-medium hover:text-blue-800 transition-colors">ไปหน้ากรอกข้อมูล &rarr;</button>` : ''}</div>`;
    }

    // Call initData first to clear storage
    initData();
    renderApp();
  </script>
 </body>
</html>
