<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>วิเคราะห์แต้มดับแบบกราฟ (รองรับ Data Feed)</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Sarabun', sans-serif; background: #f0f4f8; padding: 20px; color: #333; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2c3e50; }
        textarea { width: 100%; height: 120px; padding: 15px; border: 2px solid #cbd5e0; border-radius: 10px; font-family: monospace; box-sizing: border-box; }
        
        .btn-group { display: flex; gap: 10px; margin: 20px 0; }
        button { flex: 1; padding: 15px; border: none; border-radius: 10px; font-size: 1.1em; font-weight: bold; cursor: pointer; color: white; transition: 0.3s; }
        .btn-load { background: #4a90e2; }
        .btn-clear { background: #a0aec0; }

        .selector-area { display: none; margin-top: 20px; border-top: 2px dashed #e2e8f0; padding-top: 20px; }
        .digit-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-top: 15px; }
        .digit-btn { padding: 12px; background: white; border: 2px solid #4a90e2; color: #4a90e2; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .digit-btn.active { background: #4a90e2; color: white; }

        .result-area { display: none; margin-top: 30px; }
        .chart-container { position: relative; height: 300px; width: 100%; margin-bottom: 20px; }
        
        .summary-box { background: #fff5f5; border: 2px solid #feb2b2; padding: 20px; border-radius: 12px; text-align: center; }
        .point-tag { display: inline-block; background: #e53e3e; color: white; padding: 5px 15px; border-radius: 20px; font-weight: bold; margin: 5px; font-size: 1.2em; }
    </style>
</head>
<body>

<div class="container">
    <h2>📊 วิเคราะห์แต้มดับ (แบบกราฟ)</h2>
    <textarea id="dataInput" placeholder="ตัวอย่างข้อมูล:&#10;2026-01-01	'860	'00&#10;2026-01-02	'201	'41"></textarea>
    
    <div class="btn-group">
        <button class="btn-load" onclick="loadData()">📥 ประมวลผลข้อมูล</button>
        <button class="btn-clear" onclick="clearAll()">🧹 ล้างข้อมูล</button>
    </div>

    <div id="statusMsg" style="text-align:center; font-weight:bold; color:#38a169;"></div>

    <div id="selectorArea" class="selector-area">
        <div style="text-align:center; font-weight:bold;">แต้มงวดล่าสุดคืออะไร?</div>
        <div class="digit-grid" id="btnGrid"></div>
    </div>

    <div id="resultArea" class="result-area">
        <div class="chart-container">
            <canvas id="pointChart"></canvas>
        </div>
        
        <div class="summary-box">
            <h3 style="color:#c53030; margin-top:0;">🚫 แต้มที่มีโอกาสมาน้อยที่สุด (แต้มดับ)</h3>
            <div id="dormantList"></div>
            <p style="font-size:0.85em; color:#666; margin-top:10px;">(วิเคราะห์จากแต้มที่ไม่เคยออกเลยตามหลังแต้มที่คุณเลือก)</p>
        </div>
    </div>
</div>

<script>
    let rawStats = [];
    let myChart = null;

    function loadData() {
        const text = document.getElementById('dataInput').value.trim();
        if(!text) return;
        const lines = text.split('\n');
        let points = [];
        
        lines.forEach(line => {
            const trimmedLine = line.trim();
            if(!trimmedLine) return;

            let p = trimmedLine.split(/\s+/);
            if(p.length >= 3) {
                // *** ตัดเครื่องหมาย ' ออกจากตัวเลข 2 ตัวล่าง ***
                const bot2 = p[2].replace(/'/g, '');
                
                if (bot2.length === 2) {
                    // คำนวณแต้ม (หลักสิบ + หลักหน่วย) % 10
                    points.push((parseInt(bot2[0]) + parseInt(bot2[1])) % 10);
                }
            }
        });

        if (points.length < 2) {
            alert("ต้องการข้อมูลอย่างน้อย 2 งวดเพื่อการวิเคราะห์กราฟ");
            return;
        }

        rawStats = [];
        for(let i=0; i<points.length-1; i++) {
            rawStats.push({ curr: points[i], next: points[i+1] });
        }

        document.getElementById('statusMsg').innerText = `✅ วิเคราะห์ข้อมูล ${points.length} งวดสำเร็จ`;
        document.getElementById('selectorArea').style.display = 'block';
        
        // สร้างปุ่มเลือกแต้ม 0-9
        const btnGrid = document.getElementById('btnGrid');
        btnGrid.innerHTML = '';
        for(let i=0; i<=9; i++) {
            btnGrid.innerHTML += `<button class="digit-btn" onclick="showGraph(${i}, this)">${i}</button>`;
        }
    }

    function showGraph(target, btn) {
        document.querySelectorAll('.digit-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        let freq = Array(10).fill(0);
        rawStats.forEach(s => {
            if(s.curr === target) freq[s.next]++;
        });

        document.getElementById('resultArea').style.display = 'block';
        renderChart(freq);
        
        // หาแต้มที่ความถี่เป็น 0 (Dormant Points)
        let dormant = [];
        freq.forEach((f, i) => { if(f === 0) dormant.push(i); });
        
        const dormantHtml = dormant.length > 0 
            ? dormant.map(d => `<span class="point-tag">${d}</span>`).join('')
            : '<span style="color:#666;">ไม่มีแต้มดับ (ออกครบทุกแต้ม)</span>';
            
        document.getElementById('dormantList').innerHTML = dormantHtml;
    }

    function renderChart(data) {
        const ctx = document.getElementById('pointChart').getContext('2d');
        if(myChart) myChart.destroy();
        myChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['แต้ม 0','แต้ม 1','แต้ม 2','แต้ม 3','แต้ม 4','แต้ม 5','แต้ม 6','แต้ม 7','แต้ม 8','แต้ม 9'],
                datasets: [{
                    label: 'จำนวนครั้งที่ออกงวดถัดไป',
                    data: data,
                    backgroundColor: data.map(v => v === 0 ? '#feb2b2' : '#4a90e2'),
                    borderColor: '#2b6cb0',
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
            }
        });
    }

    function clearAll() {
        document.getElementById('dataInput').value = '';
        document.getElementById('selectorArea').style.display = 'none';
        document.getElementById('resultArea').style.display = 'none';
        document.getElementById('statusMsg').innerText = '';
        if(myChart) myChart.destroy();
    }
</script>
</body>
</html>
