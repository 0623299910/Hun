<!doctype html>
<html lang="th" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Number Generator</title>
  <script src="/_sdk/element_sdk.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      box-sizing: border-box;
    }
    
    @keyframes spin-in {
      0% { transform: rotateX(0deg); }
      100% { transform: rotateX(360deg); }
    }
    
    .number-spin {
      animation: spin-in 0.5s ease-out;
    }
  </style>
  <style>@view-transition { navigation: auto; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
 </head>
 <body class="h-full">
  <div id="app" class="w-full h-full"></div>
  <script>
    const defaultConfig = {
      background_color: "#1e293b",
      card_color: "#334155",
      text_color: "#f1f5f9",
      button_color: "#3b82f6",
      number_color: "#fbbf24",
      main_title: "เครื่องสุ่มตัวเลข",
      set_one_label: "ชุดที่ 1",
      set_two_label: "ชุดที่ 2",
      button_text: "สุ่มตัวเลข",
      font_family: "Kanit",
      font_size: 16
    };

    let setOneNumber = "?";
    let setTwoNumber = "?";

    function randomNumber() {
      return Math.floor(Math.random() * 10);
    }

    function handleRandomize() {
      const newSetOne = randomNumber();
      const newSetTwo = randomNumber();
      
      setOneNumber = newSetOne.toString();
      setTwoNumber = newSetTwo.toString();
      
      updateUI();
    }

    function updateUI() {
      const config = window.elementSdk?.config || defaultConfig;
      
      const backgroundColor = config.background_color || defaultConfig.background_color;
      const cardColor = config.card_color || defaultConfig.card_color;
      const textColor = config.text_color || defaultConfig.text_color;
      const buttonColor = config.button_color || defaultConfig.button_color;
      const numberColor = config.number_color || defaultConfig.number_color;
      const mainTitle = config.main_title || defaultConfig.main_title;
      const setOneLabel = config.set_one_label || defaultConfig.set_one_label;
      const setTwoLabel = config.set_two_label || defaultConfig.set_two_label;
      const buttonText = config.button_text || defaultConfig.button_text;
      const fontFamily = config.font_family || defaultConfig.font_family;
      const fontSize = config.font_size || defaultConfig.font_size;

      const app = document.getElementById('app');
      
      app.innerHTML = `
        <div class="w-full h-full flex items-center justify-center p-6" style="background-color: ${backgroundColor}; font-family: '${fontFamily}', system-ui, -apple-system, sans-serif;">
          <div class="max-w-2xl w-full">
            <h1 class="text-center mb-8 font-bold" style="color: ${textColor}; font-size: ${fontSize * 2}px;">${mainTitle}</h1>
            
            <div class="grid grid-cols-2 gap-6 mb-8">
              <div class="rounded-xl p-8 text-center" style="background-color: ${cardColor};">
                <h2 class="mb-4 font-semibold" style="color: ${textColor}; font-size: ${fontSize * 1.25}px;">${setOneLabel}</h2>
                <div id="set-one-display" class="number-spin rounded-lg p-6 font-bold" style="background-color: ${backgroundColor}; color: ${numberColor}; font-size: ${fontSize * 4}px;">
                  ${setOneNumber}
                </div>
              </div>
              
              <div class="rounded-xl p-8 text-center" style="background-color: ${cardColor};">
                <h2 class="mb-4 font-semibold" style="color: ${textColor}; font-size: ${fontSize * 1.25}px;">${setTwoLabel}</h2>
                <div id="set-two-display" class="number-spin rounded-lg p-6 font-bold" style="background-color: ${backgroundColor}; color: ${numberColor}; font-size: ${fontSize * 4}px;">
                  ${setTwoNumber}
                </div>
              </div>
            </div>
            
            <button id="random-button" class="w-full rounded-xl py-4 font-bold transition-all duration-200 hover:shadow-lg" style="background-color: ${buttonColor}; color: ${textColor}; font-size: ${fontSize * 1.5}px;">
              ${buttonText}
            </button>
          </div>
        </div>
      `;
      
      document.getElementById('random-button').addEventListener('click', handleRandomize);
    }

    async function onConfigChange(config) {
      updateUI();
    }

    if (window.elementSdk) {
      window.elementSdk.init({
        defaultConfig,
        onConfigChange,
        mapToCapabilities: (config) => ({
          recolorables: [
            {
              get: () => config.background_color || defaultConfig.background_color,
              set: (value) => {
                config.background_color = value;
                window.elementSdk.setConfig({ background_color: value });
              }
            },
            {
              get: () => config.card_color || defaultConfig.card_color,
              set: (value) => {
                config.card_color = value;
                window.elementSdk.setConfig({ card_color: value });
              }
            },
            {
              get: () => config.text_color || defaultConfig.text_color,
              set: (value) => {
                config.text_color = value;
                window.elementSdk.setConfig({ text_color: value });
              }
            },
            {
              get: () => config.button_color || defaultConfig.button_color,
              set: (value) => {
                config.button_color = value;
                window.elementSdk.setConfig({ button_color: value });
              }
            },
            {
              get: () => config.number_color || defaultConfig.number_color,
              set: (value) => {
                config.number_color = value;
                window.elementSdk.setConfig({ number_color: value });
              }
            }
          ],
          borderables: [],
          fontEditable: {
            get: () => config.font_family || defaultConfig.font_family,
            set: (value) => {
              config.font_family = value;
              window.elementSdk.setConfig({ font_family: value });
            }
          },
          fontSizeable: {
            get: () => config.font_size || defaultConfig.font_size,
            set: (value) => {
              config.font_size = value;
              window.elementSdk.setConfig({ font_size: value });
            }
          }
        }),
        mapToEditPanelValues: (config) => new Map([
          ["main_title", config.main_title || defaultConfig.main_title],
          ["set_one_label", config.set_one_label || defaultConfig.set_one_label],
          ["set_two_label", config.set_two_label || defaultConfig.set_two_label],
          ["button_text", config.button_text || defaultConfig.button_text]
        ])
      });
    }

    updateUI();
  </script>

</html>
